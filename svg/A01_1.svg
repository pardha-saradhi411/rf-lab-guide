<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="200" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">A01: RF Fundamentals — Signals, Power, Frequency, Wavelength</text>
  <!-- 4 concept visual boxes -->
  <rect x="10"  y="35" width="185" height="145" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="102" y="55" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Frequency</text>
  <path d="M 20,120 Q 50,80 80,120 Q 110,160 140,120 Q 170,80 190,120" fill="none" stroke="#5bc4ef" stroke-width="2.5"/>
  <text x="102" y="155" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">f = 1/T · Unit: Hz</text>
  <text x="102" y="168" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">B1: 2140 MHz</text>
  <text x="102" y="180" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">B28: 758 MHz (lower=better coverage)</text>

  <rect x="205" y="35" width="185" height="145" fill="#0d1a0d" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="297" y="55" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Wavelength</text>
  <!-- wave with lambda annotation -->
  <path d="M 215,110 Q 250,70 285,110 Q 320,150 360,110" fill="none" stroke="#00d4a0" stroke-width="2.5"/>
  <line x1="215" y1="125" x2="285" y2="125" stroke="#f5a623" stroke-width="1.5"/>
  <text x="250" y="140" fill="#f5a623" font-size="9" text-anchor="middle" font-family="monospace">λ</text>
  <text x="297" y="155" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">λ = c/f · c=3×10⁸ m/s</text>
  <text x="297" y="168" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">B1: 14 cm · B8: 32 cm</text>
  <text x="297" y="180" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">λ/2 = antenna element spacing</text>

  <rect x="400" y="35" width="185" height="145" fill="#1a1a0d" stroke="#c8b800" stroke-width="2" rx="4"/>
  <text x="492" y="55" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Power (dBm)</text>
  <!-- dBm bar -->
  <rect x="415" y="65"  width="40" height="80" fill="#ff6b6b40" stroke="#ff6b6b" stroke-width="1" rx="2"/>
  <rect x="463" y="85"  width="40" height="60" fill="#f5a62340" stroke="#f5a623" stroke-width="1" rx="2"/>
  <rect x="511" y="105" width="40" height="40" fill="#00d4a040" stroke="#00d4a0" stroke-width="1" rx="2"/>
  <text x="435" y="155" fill="#ff6b6b"  font-size="7" text-anchor="middle" font-family="monospace">+43dBm TX</text>
  <text x="483" y="155" fill="#f5a623"  font-size="7" text-anchor="middle" font-family="monospace">0 dBm ref</text>
  <text x="531" y="155" fill="#00d4a0"  font-size="7" text-anchor="middle" font-family="monospace">−95dBm sens</text>
  <text x="492" y="170" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+3dB=×2 power</text>
  <text x="492" y="180" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+10dB=×10 power</text>

  <rect x="595" y="35" width="195" height="145" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="692" y="55" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Amplitude</text>
  <!-- two waves, different amplitude -->
  <path d="M 605,110 Q 630,70 660,110 Q 690,150 720,110 Q 750,70 780,110" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <path d="M 605,110 Q 630,95 660,110 Q 690,125 720,110 Q 750,95 780,110" fill="none" stroke="#5bc4ef" stroke-width="2"/>
  <text x="692" y="155" fill="#ff6b6b"  font-size="8" text-anchor="middle" font-family="monospace">High amplitude (strong)</text>
  <text x="692" y="168" fill="#5bc4ef"  font-size="8" text-anchor="middle" font-family="monospace">Low amplitude (weak)</text>
  <text x="692" y="180" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">P ∝ A² (power ∝ amplitude²)</text>
</svg>