<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="110" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">RF Safety — Human Exposure, EMC, EIRP Limits</text>
  <rect x="8"   y="28" width="185" height="72" fill="#2a0d0d" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="100" y="48" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">SAR (devices)</text>
  <text x="18"  y="64" fill="#8892b0" font-size="8" font-family="monospace">W/kg into human tissue</text>
  <text x="18"  y="78" fill="#8892b0" font-size="8" font-family="monospace">FCC: 1.6 W/kg · ICNIRP: 2.0</text>
  <text x="18"  y="92" fill="#f5a623" font-size="7" font-family="monospace">Phones/wearables — not base stations</text>
  <rect x="203" y="28" width="185" height="72" fill="#1a0d0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="295" y="48" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">MPE (base station)</text>
  <text x="213" y="64" fill="#8892b0" font-size="8" font-family="monospace">Field strength at distance</text>
  <text x="213" y="78" fill="#8892b0" font-size="8" font-family="monospace">Exclusion zone around antenna</text>
  <text x="213" y="92" fill="#f5a623" font-size="7" font-family="monospace">FCC OET Bulletin 65</text>
  <rect x="398" y="28" width="185" height="72" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="490" y="48" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">EMC / EMI</text>
  <text x="408" y="64" fill="#8892b0" font-size="8" font-family="monospace">Emissions: not disturb others</text>
  <text x="408" y="78" fill="#8892b0" font-size="8" font-family="monospace">Immunity: not disturbed</text>
  <text x="408" y="92" fill="#f5a623" font-size="7" font-family="monospace">CE: EN 55032 · FCC Part 15</text>
  <rect x="593" y="28" width="199" height="72" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="692" y="48" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Lab Safety Rules</text>
  <text x="603" y="64" fill="#8892b0" font-size="8" font-family="monospace">Never near open antenna port TX on</text>
  <text x="603" y="78" fill="#8892b0" font-size="8" font-family="monospace">BOB SMA + 30 dB pad always</text>
  <text x="603" y="92" fill="#00d4a0" font-size="7" font-family="monospace">Dummy load on unused ports</text>
</svg>