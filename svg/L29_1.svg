<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="120" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">O-RAN M-Plane — NETCONF/YANG over O1 Interface</text>
  <rect x="8"   y="28" width="180" height="80" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="2" rx="4"/>
  <text x="98"  y="48" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">SMO / Controller</text>
  <text x="18"  y="64" fill="#8892b0" font-size="8" font-family="monospace">Configures RU parameters</text>
  <text x="18"  y="78" fill="#8892b0" font-size="8" font-family="monospace">Reads alarms and KPIs</text>
  <text x="18"  y="92" fill="#4a5470" font-size="7" font-family="monospace">Runs at core network level</text>
  <line x1="188" y1="68" x2="218" y2="68" stroke="#9b8cf8" stroke-width="2"/>
  <text x="203" y="60" fill="#9b8cf8" font-size="7" text-anchor="middle" font-family="monospace">O1</text>
  <rect x="218" y="28" width="180" height="80" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="308" y="48" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">O-DU M-Plane</text>
  <text x="228" y="64" fill="#8892b0" font-size="8" font-family="monospace">Aggregates RU config</text>
  <text x="228" y="78" fill="#8892b0" font-size="8" font-family="monospace">Forwards to O-RU</text>
  <line x1="398" y1="68" x2="428" y2="68" stroke="#5bc4ef" stroke-width="2"/>
  <text x="413" y="60" fill="#5bc4ef" font-size="7" text-anchor="middle" font-family="monospace">M-Plane</text>
  <rect x="428" y="28" width="180" height="80" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="518" y="48" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">O-RU (your AAU)</text>
  <text x="438" y="64" fill="#8892b0" font-size="8" font-family="monospace">NETCONF server port 830</text>
  <text x="438" y="78" fill="#8892b0" font-size="8" font-family="monospace">YANG model defines all params</text>
  <text x="438" y="92" fill="#4a5470" font-size="7" font-family="monospace">SSH + XML over TCP 830</text>
  <rect x="618" y="28" width="174" height="80" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="705" y="46" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Key YANG params</text>
  <text x="628" y="62" fill="#8892b0" font-size="8" font-family="monospace">tx-array-carrier freq/BW</text>
  <text x="628" y="76" fill="#8892b0" font-size="8" font-family="monospace">tx-common-array gain</text>
  <text x="628" y="90" fill="#8892b0" font-size="8" font-family="monospace">alarm-thresholds</text>
</svg>