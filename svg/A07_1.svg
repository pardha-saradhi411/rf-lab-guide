<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="150" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Beamforming — Phase Shift per Column → Steered Beam Direction</text>
  <rect x="8" y="30" width="80" height="110" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="48" y="48" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Col A</text>
  <text x="48" y="62" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Δφ=0°</text>
  <text x="48" y="76" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Col B</text>
  <text x="48" y="90" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Δφ=20°</text>
  <text x="48" y="104" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Col C</text>
  <text x="48" y="118" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Δφ=40°</text>
  <text x="48" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Col D</text>
  <text x="48" y="142" fill="#4a5470" font-size="6" text-anchor="middle" font-family="monospace">Δφ=60°</text>
  <!-- Beam lines showing constructive interference at angle -->
  <line x1="88" y1="55"  x2="300" y2="85"  stroke="#9b8cf8" stroke-width="1.5"/>
  <line x1="88" y1="75"  x2="300" y2="85"  stroke="#9b8cf8" stroke-width="2"/>
  <line x1="88" y1="95"  x2="300" y2="85"  stroke="#9b8cf8" stroke-width="2.5"/>
  <line x1="88" y1="115" x2="300" y2="85"  stroke="#9b8cf8" stroke-width="3"/>
  <!-- Beam at boresight (0°) -->
  <line x1="88" y1="55"  x2="300" y2="55"  stroke="#4a5470" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="88" y1="75"  x2="300" y2="55"  stroke="#4a5470" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="88" y1="95"  x2="300" y2="55"  stroke="#4a5470" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="88" y1="115" x2="300" y2="55"  stroke="#4a5470" stroke-width="0.5" stroke-dasharray="3,2"/>
  <rect x="300" y="70" width="90" height="30" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="3"/>
  <text x="345" y="87" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Beam at θ°</text>
  <rect x="300" y="40" width="90" height="22" fill="#141720" stroke="#4a5470" stroke-width="1" rx="3"/>
  <text x="345" y="54" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Boresight (0°)</text>
  <!-- Formula -->
  <rect x="410" y="30" width="382" height="110" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="601" y="50" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">θ = arcsin(λ·Δφ / 2π·d)</text>
  <text x="420" y="68" fill="#8892b0" font-size="8" font-family="monospace">λ = wavelength (m) · d = element spacing (m) · Δφ = phase step (rad)</text>
  <text x="420" y="84" fill="#5bc4ef" font-size="8" font-family="monospace">B1 (2140 MHz): λ=14cm, d=7cm (λ/2 spacing)</text>
  <text x="420" y="98" fill="#5bc4ef" font-size="8" font-family="monospace">Δφ=20° per element → θ = arcsin(0.14×0.349/(2π×0.07)) = 6.4°</text>
  <text x="420" y="112" fill="#00d4a0" font-size="8" font-family="monospace">VNA verifies actual phase vs programmed per column</text>
  <text x="420" y="126" fill="#4a5470" font-size="7" font-family="monospace">Phase error &gt;±2° → beamforming direction will be off → adjust PE44820DS register</text>
  <text x="420" y="140" fill="#4a5470" font-size="7" font-family="monospace">B8 (900MHz): λ=33cm, d=16.5cm · B28 (758MHz): λ=40cm, d=20cm</text>
</svg>