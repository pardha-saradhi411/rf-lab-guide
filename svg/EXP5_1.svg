<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="200" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">PRACH Detector — Noise Estimator, Peak Multiplier, False Alarm Rate</text>
  <!-- Detector chain -->
  <rect x="10"  y="40" width="110" height="60" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="65"  y="60" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">UL signal</text>
  <text x="65"  y="75" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">from antenna</text>
  <text x="65"  y="90" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">may contain PRACH</text>
  <line x1="120" y1="70" x2="140" y2="70" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="140" y="40" width="120" height="60" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="200" y="60" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Noise estimator</text>
  <text x="200" y="74" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Measures noise floor</text>
  <text x="200" y="87" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">in non-PRACH RBs</text>
  <text x="200" y="98" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">≈ −104 dBm ref</text>
  <line x1="260" y1="70" x2="280" y2="70" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="280" y="40" width="120" height="60" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="340" y="60" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Correlator</text>
  <text x="340" y="74" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Cross-correlate vs</text>
  <text x="340" y="87" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Zadoff-Chu preamble</text>
  <text x="340" y="98" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">839-length sequence</text>
  <line x1="400" y1="70" x2="420" y2="70" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="420" y="40" width="130" height="60" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="485" y="57" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Peak detector</text>
  <text x="485" y="71" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">peak &gt; threshold?</text>
  <text x="485" y="84" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">thresh = noise × α</text>
  <text x="485" y="97" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">α sets false alarm rate</text>
  <line x1="550" y1="70" x2="570" y2="70" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="570" y="40" width="110" height="60" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="625" y="58" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">PRACH detected</text>
  <text x="625" y="72" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">→ RA-RNTI assigned</text>
  <text x="625" y="85" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">→ RAR sent to UE</text>
  <text x="625" y="98" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">→ TA measured</text>

  <!-- Threshold diagram -->
  <text x="400" y="125" fill="#c8c8d8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Threshold = Noise_floor × Peak_multiplier (α):</text>
  <rect x="20"  y="135" width="175" height="50" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1" rx="3"/>
  <text x="107" y="153" fill="#00d4a0" font-size="9" text-anchor="middle" font-family="monospace">Low α → sensitive</text>
  <text x="107" y="166" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Detects weak UE</text>
  <text x="107" y="178" fill="#ff6b6b" font-size="7" text-anchor="middle" font-family="monospace">But more false alarms</text>
  <rect x="315" y="135" width="175" height="50" fill="#1a1a0d" stroke="#f5a623" stroke-width="1" rx="3"/>
  <text x="402" y="153" fill="#f5a623" font-size="9" text-anchor="middle" font-family="monospace">High α → robust</text>
  <text x="402" y="166" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Fewer false alarms</text>
  <text x="402" y="178" fill="#ff6b6b" font-size="7" text-anchor="middle" font-family="monospace">May miss weak UE</text>
  <text x="660" y="153" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Your RU sensitivity</text>
  <text x="660" y="166" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">test verifies the UE</text>
  <text x="660" y="178" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">clears the threshold</text>
</svg>