<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="200" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Propagation Channel Models — AWGN, EPA, EVA, ETU, PropSim</text>
  <!-- Model boxes -->
  <rect x="10"  y="35" width="148" height="150" fill="#0d1a0d" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="84"  y="55" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">AWGN</text>
  <text x="84"  y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">White Gaussian Noise</text>
  <!-- Flat line representing AWGN -->
  <path d="M 20,110 Q 30,107 40,112 Q 50,108 60,111 Q 70,109 80,113 Q 90,107 100,111 Q 110,109 120,113 Q 130,108 145,110" fill="none" stroke="#00d4a0" stroke-width="2"/>
  <text x="84"  y="138" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Single path, no fading</text>
  <text x="84"  y="152" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">Lab baseline test</text>
  <text x="84"  y="166" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Ideal conditions</text>
  <text x="84"  y="178" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Sensitivity test model</text>

  <rect x="165" y="35" width="148" height="150" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="239" y="55" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">EPA</text>
  <text x="239" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Extended Pedestrian A</text>
  <!-- Multi-tap representation -->
  <line x1="175" y1="115" x2="305" y2="115" stroke="#4a5470" stroke-width="1"/>
  <rect x="185" y="100" width="8" height="15" fill="#5bc4ef" rx="1"/>
  <rect x="215" y="105" width="8" height="10" fill="#5bc4ef" rx="1"/>
  <rect x="245" y="108" width="8" height="7"  fill="#5bc4ef" rx="1"/>
  <rect x="275" y="110" width="8" height="5"  fill="#5bc4ef" rx="1"/>
  <text x="239" y="138" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">7 taps, 0-410ns delay</text>
  <text x="239" y="152" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">5 km/h (pedestrian)</text>
  <text x="239" y="166" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Low Doppler spread</text>
  <text x="239" y="178" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Indoor/suburban</text>

  <rect x="320" y="35" width="148" height="150" fill="#1a1a0d" stroke="#c8b800" stroke-width="2" rx="4"/>
  <text x="394" y="55" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">EVA</text>
  <text x="394" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Extended Vehicular A</text>
  <line x1="330" y1="115" x2="460" y2="115" stroke="#4a5470" stroke-width="1"/>
  <rect x="340" y="90"  width="8" height="25" fill="#c8b800" rx="1"/>
  <rect x="365" y="100" width="8" height="15" fill="#c8b800" rx="1"/>
  <rect x="390" y="105" width="8" height="10" fill="#c8b800" rx="1"/>
  <rect x="415" y="108" width="8" height="7"  fill="#c8b800" rx="1"/>
  <rect x="440" y="110" width="8" height="5"  fill="#c8b800" rx="1"/>
  <text x="394" y="138" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">9 taps, 0-2.51μs delay</text>
  <text x="394" y="152" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">120 km/h (vehicular)</text>
  <text x="394" y="166" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Higher Doppler spread</text>
  <text x="394" y="178" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Urban micro cell</text>

  <rect x="475" y="35" width="148" height="150" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="549" y="55" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">ETU</text>
  <text x="549" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Extended Typical Urban</text>
  <line x1="485" y1="115" x2="615" y2="115" stroke="#4a5470" stroke-width="1"/>
  <rect x="490" y="80"  width="8" height="35" fill="#ff6b6b" rx="1"/>
  <rect x="510" y="90"  width="8" height="25" fill="#ff6b6b" rx="1"/>
  <rect x="530" y="95"  width="8" height="20" fill="#ff6b6b" rx="1"/>
  <rect x="550" y="100" width="8" height="15" fill="#ff6b6b" rx="1"/>
  <rect x="570" y="105" width="8" height="10" fill="#ff6b6b" rx="1"/>
  <rect x="590" y="108" width="8" height="7"  fill="#ff6b6b" rx="1"/>
  <text x="549" y="138" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">9 taps, 0-5μs delay</text>
  <text x="549" y="152" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">High delay spread</text>
  <text x="549" y="166" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Dense urban macro</text>
  <text x="549" y="178" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Worst ISI condition</text>

  <rect x="630" y="35" width="160" height="150" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="2" rx="4"/>
  <text x="710" y="55" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">PropSim</text>
  <text x="710" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Propagation Simulator</text>
  <text x="710" y="88" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Hardware box between</text>
  <text x="710" y="101" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">EXM and RU port</text>
  <text x="710" y="118" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">Emulates EPA/EVA/ETU</text>
  <text x="710" y="132" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">in real-time hardware</text>
  <text x="710" y="149" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Used for conformance</text>
  <text x="710" y="163" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">when AWGN not enough</text>
  <text x="710" y="178" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Your bench: AWGN only</text>
</svg>