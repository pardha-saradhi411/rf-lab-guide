<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="240" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Calibration Types — What, When, Why</text>

  <!-- Cal types grid -->
  <rect x="10"  y="35" width="175" height="70" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="97"  y="53" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">TX Calibration</text>
  <text x="20"  y="68" fill="#8892b0" font-size="8" font-family="monospace">Sets output power accuracy</text>
  <text x="20"  y="80" fill="#8892b0" font-size="8" font-family="monospace">tx_calibration_eeprom.json</text>
  <text x="20"  y="92" fill="#f5a623" font-size="8" font-family="monospace">Missing → fault 12 → -6dB deficit</text>
  <text x="20"  y="104" fill="#4a5470" font-size="7" font-family="monospace">Run at factory + after HW change</text>

  <rect x="195" y="35" width="175" height="70" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="282" y="53" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">RX Calibration</text>
  <text x="205" y="68" fill="#8892b0" font-size="8" font-family="monospace">RSSI accuracy calibration</text>
  <text x="205" y="80" fill="#8892b0" font-size="8" font-family="monospace">ADC_ADJUST in hardware.json</text>
  <text x="205" y="92" fill="#f5a623" font-size="8" font-family="monospace">Wrong → RSSI ±5dB error</text>
  <text x="205" y="104" fill="#4a5470" font-size="7" font-family="monospace">Inject known power → adjust offset</text>

  <rect x="380" y="35" width="175" height="70" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="467" y="53" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">IQ Calibration</text>
  <text x="390" y="68" fill="#8892b0" font-size="8" font-family="monospace">Corrects I/Q gain+phase mismatch</text>
  <text x="390" y="80" fill="#8892b0" font-size="8" font-family="monospace">Per-element, per-band</text>
  <text x="390" y="92" fill="#f5a623" font-size="8" font-family="monospace">Wrong → EVM floor, IRR degrades</text>
  <text x="390" y="104" fill="#4a5470" font-size="7" font-family="monospace">OB_CAL: observation-based cal</text>

  <rect x="565" y="35" width="225" height="70" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="677" y="53" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Temperature Calibration</text>
  <text x="575" y="68" fill="#8892b0" font-size="8" font-family="monospace">TX power changes with temp</text>
  <text x="575" y="80" fill="#8892b0" font-size="8" font-family="monospace">Thermal comp table in config</text>
  <text x="575" y="92" fill="#f5a623" font-size="8" font-family="monospace">Not run → power drifts ±2dB</text>
  <text x="575" y="104" fill="#4a5470" font-size="7" font-family="monospace">Run at -40°C, 25°C, +55°C, +70°C</text>

  <!-- Second row -->
  <rect x="10"  y="115" width="175" height="65" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="97"  y="133" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Phase Calibration</text>
  <text x="20"  y="148" fill="#8892b0" font-size="8" font-family="monospace">Element-to-element phase</text>
  <text x="20"  y="160" fill="#8892b0" font-size="8" font-family="monospace">alignment for beamforming</text>
  <text x="20"  y="172" fill="#f5a623" font-size="8" font-family="monospace">VNA E5071C: per-element</text>

  <rect x="195" y="115" width="175" height="65" fill="#1a1a0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="282" y="133" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Gain Calibration</text>
  <text x="205" y="148" fill="#8892b0" font-size="8" font-family="monospace">Sets absolute gain per chain</text>
  <text x="205" y="160" fill="#8892b0" font-size="8" font-family="monospace">per band, per column</text>
  <text x="205" y="172" fill="#f5a623" font-size="8" font-family="monospace">gain_cal_eeprom.json</text>

  <rect x="380" y="115" width="175" height="65" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="467" y="133" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Factory Calibration</text>
  <text x="390" y="148" fill="#8892b0" font-size="8" font-family="monospace">Done once at production</text>
  <text x="390" y="160" fill="#8892b0" font-size="8" font-family="monospace">All cals → stored in EEPROM</text>
  <text x="390" y="172" fill="#f5a623" font-size="8" font-family="monospace">Corrupted EEPROM = many faults</text>

  <rect x="565" y="115" width="225" height="65" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="677" y="133" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Field Calibration</text>
  <text x="575" y="148" fill="#8892b0" font-size="8" font-family="monospace">After RU replacement</text>
  <text x="575" y="160" fill="#8892b0" font-size="8" font-family="monospace">Or after antenna change</text>
  <text x="575" y="172" fill="#f5a623" font-size="8" font-family="monospace">Partial re-cal: TX+RX+temp</text>

  <!-- Key principle -->
  <rect x="10" y="190" width="780" height="42" fill="#001a00" stroke="#00d4a0" stroke-width="1" rx="4"/>
  <text x="400" y="207" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Golden Rule: Every calibration file has a dependency. If tx_calibration_eeprom.json is missing → fault 12 → TX power -6dB below expected.</text>
  <text x="400" y="224" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Check calibration files FIRST when power or RSSI anomalies appear. Location: /etc/rru/ or /opt/pw/config/ on RU filesystem via SSH.</text>
</svg>