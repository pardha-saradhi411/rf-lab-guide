<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="120" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Power Supply Testing — Sequencing, Inrush, Ripple, Brownout</text>
  <rect x="8"   y="28" width="186" height="80" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="101" y="47" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Power Sequencing</text>
  <text x="18"  y="63" fill="#8892b0" font-size="8" font-family="monospace">FPGA core → I/O → PA bias</text>
  <text x="18"  y="77" fill="#8892b0" font-size="8" font-family="monospace">Wrong order → latchup/damage</text>
  <text x="18"  y="91" fill="#f5a623" font-size="7" font-family="monospace">Verify with oscilloscope trigger</text>
  <rect x="204" y="28" width="186" height="80" fill="#2a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="297" y="47" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Inrush Current</text>
  <text x="214" y="63" fill="#8892b0" font-size="8" font-family="monospace">Large caps charge at power-on</text>
  <text x="214" y="77" fill="#8892b0" font-size="8" font-family="monospace">Can trip PSU / site breaker</text>
  <text x="214" y="91" fill="#f5a623" font-size="7" font-family="monospace">Measure: scope + current CT</text>
  <rect x="400" y="28" width="186" height="80" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="493" y="47" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">PSU Ripple → Spurious</text>
  <text x="410" y="63" fill="#8892b0" font-size="8" font-family="monospace">AC ripple on DC rail</text>
  <text x="410" y="77" fill="#8892b0" font-size="8" font-family="monospace">Modulates PA → AM sidebands</text>
  <text x="410" y="91" fill="#f5a623" font-size="7" font-family="monospace">Limit &lt;50 mV p-p · check with scope</text>
  <rect x="596" y="28" width="196" height="80" fill="#1a0d0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="694" y="47" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Brownout −48V range</text>
  <text x="606" y="63" fill="#8892b0" font-size="8" font-family="monospace">−48V ±10% (−43 to −53V)</text>
  <text x="606" y="77" fill="#8892b0" font-size="8" font-family="monospace">Low Vdc → PA gain drops</text>
  <text x="606" y="91" fill="#f5a623" font-size="7" font-family="monospace">Test: sweep Vdc, measure TX power</text>
</svg>