<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:16px">
  <rect width="800" height="320" fill="#0d0f14" rx="10"/>
  <text x="400" y="28" fill="#c8c8d8" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">PA Drain Efficiency vs Output Power Backoff</text>

  <!-- Axes -->
  <line x1="80" y1="260" x2="740" y2="260" stroke="#4a5470" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="260" stroke="#4a5470" stroke-width="1.5"/>

  <!-- X axis labels -->
  <text x="80"  y="278" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">0dB</text>
  <text x="190" y="278" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">-3dB</text>
  <text x="300" y="278" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">-6dB</text>
  <text x="410" y="278" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">-9dB</text>
  <text x="520" y="278" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">-12dB</text>
  <text x="630" y="278" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">-15dB</text>
  <text x="400" y="298" fill="#8892b0" font-size="10" text-anchor="middle" font-family="monospace">Output Power Backoff from Rated (dB)</text>

  <!-- Y axis labels -->
  <text x="72" y="264" fill="#8892b0" font-size="9" text-anchor="end" font-family="monospace">0%</text>
  <text x="72" y="221" fill="#8892b0" font-size="9" text-anchor="end" font-family="monospace">20%</text>
  <text x="72" y="179" fill="#8892b0" font-size="9" text-anchor="end" font-family="monospace">40%</text>
  <text x="72" y="136" fill="#8892b0" font-size="9" text-anchor="end" font-family="monospace">60%</text>
  <text x="72" y="93"  fill="#8892b0" font-size="9" text-anchor="end" font-family="monospace">80%</text>
  <text x="30" y="165" fill="#8892b0" font-size="10" text-anchor="middle" font-family="monospace" transform="rotate(-90,30,165)">Drain Efficiency (%)</text>

  <!-- Grid lines -->
  <line x1="80" y1="221" x2="740" y2="221" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="80" y1="179" x2="740" y2="179" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="80" y1="136" x2="740" y2="136" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="80" y1="93"  x2="740" y2="93"  stroke="#1a1f2e" stroke-width="1"/>

  <!-- Class A line: 50% at 0dB, drops linearly to ~8% at -15dB -->
  <polyline points="80,153 190,175 300,196 410,217 520,238 630,251 740,257"
    fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="745" y="257" fill="#ff6b6b" font-size="10" font-family="monospace">A</text>

  <!-- Class AB line: 65% at 0dB, drops to ~15% at -15dB -->
  <polyline points="80,120 190,147 300,173 410,200 520,222 630,240 740,252"
    fill="none" stroke="#5bc4ef" stroke-width="2.5"/>
  <text x="745" y="252" fill="#5bc4ef" font-size="10" font-family="monospace">AB</text>

  <!-- Doherty line: starts 65%, stays ~60% until -8dB, then drops -->
  <polyline points="80,120 190,124 300,131 410,140 520,162 630,200 740,235"
    fill="none" stroke="#00d4a0" stroke-width="3"/>
  <text x="745" y="235" fill="#00d4a0" font-size="10" font-family="monospace">Doherty</text>

  <!-- Vertical dashed line at -6dB (typical LTE operating point) -->
  <line x1="300" y1="50" x2="300" y2="260" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="302" y="62" fill="#f5a623" font-size="9" font-family="monospace">Typical LTE</text>
  <text x="302" y="74" fill="#f5a623" font-size="9" font-family="monospace">operating point</text>

  <!-- Annotation: Doherty advantage -->
  <rect x="480" y="90" width="200" height="50" fill="#001a0d" stroke="#00d4a0" stroke-width="1" rx="4"/>
  <text x="580" y="108" fill="#00d4a0" font-size="10" text-anchor="middle" font-family="monospace">Doherty advantage:</text>
  <text x="580" y="122" fill="#c8c8d8" font-size="9" text-anchor="middle" font-family="monospace">~60% efficiency at -6dB</text>
  <text x="580" y="134" fill="#c8c8d8" font-size="9" text-anchor="middle" font-family="monospace">vs Class AB ~40%</text>

  <!-- Legend -->
  <line x1="90" y1="45" x2="115" y2="45" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="120" y="49" fill="#ff6b6b" font-size="10" font-family="monospace">Class A (max 50%)</text>
  <line x1="240" y1="45" x2="265" y2="45" stroke="#5bc4ef" stroke-width="2.5"/>
  <text x="270" y="49" fill="#5bc4ef" font-size="10" font-family="monospace">Class AB (max 65%)</text>
  <line x1="410" y1="45" x2="435" y2="45" stroke="#00d4a0" stroke-width="3"/>
  <text x="440" y="49" fill="#00d4a0" font-size="10" font-family="monospace">Doherty (stays high)</text>
</svg>