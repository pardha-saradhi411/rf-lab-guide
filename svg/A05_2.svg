<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:14px 0 8px">
  <rect width="800" height="150" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">DPD Convergence — ACLR vs Time After TX Enable</text>
  <!-- Axes -->
  <line x1="60" y1="120" x2="760" y2="120" stroke="#4a5470" stroke-width="1.5"/>
  <line x1="60" y1="30"  x2="60"  y2="120" stroke="#4a5470" stroke-width="1.5"/>
  <!-- Y axis labels -->
  <text x="55" y="35"  fill="#ff6b6b" font-size="8" text-anchor="end" font-family="monospace">−30</text>
  <text x="55" y="55"  fill="#c8b800" font-size="8" text-anchor="end" font-family="monospace">−35</text>
  <text x="55" y="75"  fill="#f5a623" font-size="8" text-anchor="end" font-family="monospace">−40</text>
  <text x="55" y="95"  fill="#00d4a0" font-size="8" text-anchor="end" font-family="monospace">−45</text>
  <text x="55" y="115" fill="#5bc4ef" font-size="8" text-anchor="end" font-family="monospace">−50</text>
  <text x="30" y="80" fill="#4a5470" font-size="8" text-anchor="middle" transform="rotate(-90,30,80)" font-family="monospace">ACLR (dBc)</text>
  <!-- X axis labels -->
  <text x="60"  y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">0s</text>
  <text x="165" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">10s</text>
  <text x="270" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">20s</text>
  <text x="375" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">30s</text>
  <text x="480" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">40s</text>
  <text x="585" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">50s</text>
  <text x="690" y="132" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">60s</text>
  <text x="410" y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Time after TX enable →</text>
  <!-- Limit line -->
  <line x1="60" y1="95" x2="760" y2="95" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="765" y="95" fill="#ff6b6b" font-size="7" font-family="monospace">−45 limit</text>
  <!-- ACLR curve — starts bad, improves -->
  <polyline points="60,35 90,38 120,45 165,58 210,70 270,82 330,90 390,96 450,100 510,104 570,106 630,107 690,108 750,108"
    fill="none" stroke="#00d4a0" stroke-width="2.5"/>
  <!-- Shaded danger zone -->
  <rect x="60" y="30" width="360" height="65" fill="#ff6b6b" opacity="0.05"/>
  <!-- Annotations -->
  <rect x="65" y="36" width="120" height="24" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="125" y="48" fill="#ff6b6b" font-size="8" text-anchor="middle" font-family="monospace">DPD adapting</text>
  <text x="125" y="57" fill="#ff6b6b" font-size="7" text-anchor="middle" font-family="monospace">ACLR unstable — DO NOT MEASURE</text>
  <rect x="460" y="86" width="120" height="24" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1" rx="3"/>
  <text x="520" y="98" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">DPD converged ✓</text>
  <text x="520" y="107" fill="#00d4a0" font-size="7" text-anchor="middle" font-family="monospace">Safe to measure ACLR now</text>
  <!-- 60s marker -->
  <line x1="690" y1="30" x2="690" y2="120" stroke="#00d4a0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="692" y="45" fill="#00d4a0" font-size="8" font-family="monospace">60s rule</text>
</svg>