<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:14px 0 8px">
  <rect width="800" height="160" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">PA Class Efficiency vs Linearity vs Your AAU Heat Dissipation</text>
  <!-- Bar chart -->
  <rect x="30" y="28" width="370" height="120" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="215" y="46" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Max efficiency by class</text>
  <!-- Bars -->
  <rect x="50"  y="115" width="40" height="-30"  fill="#5bc4ef" rx="2" transform="scale(1,-1) translate(0,-143)"/>
  <text x="70"  y="125" fill="#5bc4ef"  font-size="8" text-anchor="middle" font-family="monospace">Class A</text>
  <text x="70"  y="100" fill="#5bc4ef"  font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">30%</text>

  <rect x="110" y="115" width="40" height="-78"  fill="#00d4a0" rx="2" transform="scale(1,-1) translate(0,-143)"/>
  <text x="130" y="125" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">Class B</text>
  <text x="130" y="68"  fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">78%</text>

  <rect x="170" y="115" width="40" height="-45"  fill="#f5a623" rx="2" transform="scale(1,-1) translate(0,-143)"/>
  <text x="190" y="125" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">Class AB</text>
  <text x="190" y="95"  fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">45%</text>
  <text x="190" y="107" fill="#00d4a0" font-size="7" text-anchor="middle" font-family="monospace">Your AAU</text>

  <rect x="230" y="115" width="40" height="-90"  fill="#9b8cf8" rx="2" transform="scale(1,-1) translate(0,-143)"/>
  <text x="250" y="125" fill="#9b8cf8" font-size="8" text-anchor="middle" font-family="monospace">Class F</text>
  <text x="250" y="55"  fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">90%</text>
  <text x="250" y="66"  fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">narrowband</text>

  <rect x="290" y="115" width="60" height="-55"  fill="#ff6b6b" rx="2" transform="scale(1,-1) translate(0,-143)"/>
  <text x="320" y="125" fill="#ff6b6b" font-size="8" text-anchor="middle" font-family="monospace">AB+DynVdd</text>
  <text x="320" y="85"  fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">55%</text>
  <text x="320" y="96"  fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">avg efficiency</text>
  <!-- Y axis -->
  <line x1="40" y1="30" x2="40" y2="118" stroke="#4a5470" stroke-width="1"/>
  <text x="38" y="118" fill="#4a5470" font-size="7" text-anchor="end" font-family="monospace">0%</text>
  <text x="38" y="90"  fill="#4a5470" font-size="7" text-anchor="end" font-family="monospace">30%</text>
  <text x="38" y="62"  fill="#4a5470" font-size="7" text-anchor="end" font-family="monospace">60%</text>
  <text x="38" y="34"  fill="#4a5470" font-size="7" text-anchor="end" font-family="monospace">90%</text>

  <!-- Heat table -->
  <rect x="410" y="28" width="382" height="120" fill="#141720" stroke="#ff6b6b" stroke-width="1" rx="4"/>
  <text x="601" y="46" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Your AAU heat dissipation (B1, 1 column)</text>
  <g font-family="monospace" font-size="9">
  <text x="420" y="64"  fill="#8892b0">PA output power:      <tspan fill="#f5a623">+43 dBm = 20W</tspan></text>
  <text x="420" y="80"  fill="#8892b0">Class AB efficiency:  <tspan fill="#f5a623">~35% (OFDM avg)</tspan></text>
  <text x="420" y="96"  fill="#8892b0">DC input power:       <tspan fill="#f5a623">20 / 0.35 = 57W per column</tspan></text>
  <text x="420" y="112" fill="#8892b0">Heat per column:      <tspan fill="#ff6b6b">57 − 20 = 37W</tspan></text>
  <text x="420" y="128" fill="#8892b0">4 columns total heat: <tspan fill="#ff6b6b">37 × 4 = 148W</tspan></text>
  <text x="420" y="143" fill="#00d4a0">With Dynamic Vdd:     <tspan>~85W avg (55% eff)</tspan></text>
  </g>
</svg>