<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="380" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Complete RF System Architecture — TX + RX + Every Block Purpose</text>

  <!-- TX STACK (left column, top to bottom) -->
  <text x="200" y="46" fill="#ff6b6b" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">📤 TX PATH (Downlink)</text>

  <rect x="80" y="55" width="240" height="30" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="200" y="70" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">L2/L3 — MAC/RLC/PDCP</text>
  <text x="200" y="82" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Scheduling, ARQ, packet header | Failure: no data, PDCP drops</text>

  <line x1="200" y1="85" x2="200" y2="100" stroke="#ff6b6b" stroke-width="1.5"/>

  <rect x="80" y="100" width="240" height="30" fill="#1a0d0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="200" y="115" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">PHY — Physical Layer</text>
  <text x="200" y="127" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">OFDM modulation, coding, HARQ | Failure: high BLER, EVM</text>

  <line x1="200" y1="130" x2="200" y2="145" stroke="#f5a623" stroke-width="1.5"/>

  <rect x="80" y="145" width="240" height="30" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="200" y="160" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Baseband — CFR + DPD</text>
  <text x="200" y="172" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">PAPR reduction, linearisation | Failure: ACLR, EVM</text>

  <line x1="200" y1="175" x2="200" y2="190" stroke="#c8b800" stroke-width="1.5"/>

  <rect x="80" y="190" width="240" height="30" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="200" y="205" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">IQ Samples → DAC</text>
  <text x="200" y="217" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Digital→Analog, 12-16bit | Failure: quantisation noise, spur</text>

  <line x1="200" y1="220" x2="200" y2="235" stroke="#c8b800" stroke-width="1.5"/>

  <rect x="80" y="235" width="240" height="30" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="200" y="250" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Upconverter (Mixer + PLL)</text>
  <text x="200" y="262" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Baseband→RF freq | Failure: LO leakage, image, phase noise</text>

  <line x1="200" y1="265" x2="200" y2="280" stroke="#5bc4ef" stroke-width="1.5"/>

  <rect x="60"  y="280" width="280" height="38" fill="#2a0000" stroke="#ff6b6b" stroke-width="2.5" rx="4"/>
  <text x="200" y="297" fill="#ff6b6b" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">PA — Power Amplifier</text>
  <text x="200" y="309" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">GaN, +40dB gain, Doherty | Failure: ACLR, EVM, protection trip</text>
  <text x="200" y="321" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Most important block — needs DPD, thermal mgmt, bias sequencing</text>

  <line x1="200" y1="318" x2="200" y2="335" stroke="#9b8cf8" stroke-width="1.5"/>

  <rect x="80" y="335" width="240" height="30" fill="#0d1a1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="200" y="350" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Duplexer → Antenna</text>
  <text x="200" y="362" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">TX/RX isolation, 0.5dB NF | Failure: VSWR, cross-band interference</text>

  <!-- RX STACK (right column, bottom to top) -->
  <text x="600" y="46" fill="#00d4a0" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">📥 RX PATH (Uplink)</text>

  <rect x="480" y="55" width="240" height="30" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="600" y="70" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">PHY → Baseband → L2/L3</text>
  <text x="600" y="82" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Demod, decode, deliver to DU | Failure: BLER, RSSI wrong</text>

  <line x1="600" y1="85" x2="600" y2="100" stroke="#00d4a0" stroke-width="1.5"/>

  <rect x="480" y="100" width="240" height="30" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="600" y="115" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">ADC — 12-bit digitiser</text>
  <text x="600" y="127" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Analog→Digital, SQNR 72dB | Failure: overrange, quantisation</text>

  <line x1="600" y1="130" x2="600" y2="145" stroke="#00d4a0" stroke-width="1.5"/>

  <rect x="480" y="145" width="240" height="30" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="600" y="160" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">VGA / AGC</text>
  <text x="600" y="172" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Gain control → ADC range | Failure: saturation, weak signal</text>

  <line x1="600" y1="175" x2="600" y2="190" stroke="#c8b800" stroke-width="1.5"/>

  <rect x="480" y="190" width="240" height="30" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="600" y="205" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Mixer — Downconverter</text>
  <text x="600" y="217" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">RF→Baseband | Failure: image, IIP3, NF adds 7dB (÷LNA gain)</text>

  <line x1="600" y1="220" x2="600" y2="235" stroke="#5bc4ef" stroke-width="1.5"/>

  <rect x="480" y="235" width="240" height="30" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="600" y="250" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">BPF — Bandpass Filter</text>
  <text x="600" y="262" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Image/blocker rejection | Failure: blocker passes, out-of-band noise</text>

  <line x1="600" y1="265" x2="600" y2="280" stroke="#00d4a0" stroke-width="1.5"/>

  <rect x="460" y="280" width="280" height="38" fill="#001a00" stroke="#00d4a0" stroke-width="2.5" rx="4"/>
  <text x="600" y="297" fill="#00d4a0" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">LNA — Low Noise Amplifier</text>
  <text x="600" y="309" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">NF=2dB, G=+20dB | SETS ALL: everything after ÷100</text>
  <text x="600" y="321" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Most important RX block — NF directly = sensitivity</text>

  <line x1="600" y1="318" x2="600" y2="335" stroke="#9b8cf8" stroke-width="1.5"/>

  <rect x="480" y="335" width="240" height="30" fill="#0d1a1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="600" y="350" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Duplexer → Antenna (shared)</text>
  <text x="600" y="362" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Collects signal | NF=0.5dB (before LNA = full penalty)</text>

  <!-- Connection at antenna level -->
  <line x1="320" y1="350" x2="480" y2="350" stroke="#4a5470" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="345" fill="#4a5470" font-size="9" text-anchor="middle" font-family="monospace">Shared antenna port</text>
</svg>