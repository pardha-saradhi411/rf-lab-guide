<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="120" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Linux Commands — Daily Essentials for RF Engineers</text>
  <rect x="8" y="28" width="246" height="82" fill="#0a0a0a" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="131" y="46" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Log Analysis</text>
  <text x="18" y="62" fill="#f5a623" font-size="8" font-family="monospace">journalctl -fu ruauto</text><text x="168" y="62" fill="#8892b0" font-size="8" font-family="monospace">live test log</text>
  <text x="18" y="76" fill="#f5a623" font-size="8" font-family="monospace">grep -i "fail\|fault" *.log</text><text x="192" y="76" fill="#8892b0" font-size="8" font-family="monospace">search errors</text>
  <text x="18" y="90" fill="#f5a623" font-size="8" font-family="monospace">dmesg | grep PA</text><text x="146" y="90" fill="#8892b0" font-size="8" font-family="monospace">kernel PA events</text>
  <text x="18" y="104" fill="#f5a623" font-size="8" font-family="monospace">tail -f /var/log/rru/*.log</text><text x="192" y="104" fill="#8892b0" font-size="8" font-family="monospace">live log stream</text>
  <rect x="264" y="28" width="246" height="82" fill="#0a0a0a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="387" y="46" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Network Debug</text>
  <text x="274" y="62" fill="#f5a623" font-size="8" font-family="monospace">tcpdump -i eth0 port 830</text><text x="440" y="62" fill="#8892b0" font-size="8" font-family="monospace">NETCONF</text>
  <text x="274" y="76" fill="#f5a623" font-size="8" font-family="monospace">tcpdump -i eth1 udp</text><text x="412" y="76" fill="#8892b0" font-size="8" font-family="monospace">eCPRI/PTP pkts</text>
  <text x="274" y="90" fill="#f5a623" font-size="8" font-family="monospace">ping -i 0.01 &lt;DU_IP&gt;</text><text x="418" y="90" fill="#8892b0" font-size="8" font-family="monospace">latency check</text>
  <text x="274" y="104" fill="#f5a623" font-size="8" font-family="monospace">ss -tlnp | grep 5025</text><text x="432" y="104" fill="#8892b0" font-size="8" font-family="monospace">SCPI port open?</text>
  <rect x="520" y="28" width="272" height="82" fill="#0a0a0a" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="656" y="46" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">System + RF Debug</text>
  <text x="530" y="62" fill="#f5a623" font-size="8" font-family="monospace">systemctl status ruauto</text><text x="688" y="62" fill="#8892b0" font-size="8" font-family="monospace">service health</text>
  <text x="530" y="76" fill="#f5a623" font-size="8" font-family="monospace">top</text><text x="558" y="76" fill="#8892b0" font-size="8" font-family="monospace">CPU load (DPD is heavy)</text>
  <text x="530" y="90" fill="#f5a623" font-size="8" font-family="monospace">awk '{print $3}' rssi.log</text><text x="690" y="90" fill="#8892b0" font-size="8" font-family="monospace">parse RSSI col</text>
  <text x="530" y="104" fill="#f5a623" font-size="8" font-family="monospace">ssh -i key.pem root@RU_IP</text><text x="726" y="104" fill="#8892b0" font-size="8" font-family="monospace">remote access</text>
</svg>