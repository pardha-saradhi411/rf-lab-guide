<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="260" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">ADC &amp; dBFS — Analog to Digital Conversion, Quantisation, Full Scale</text>

  <!-- ADC staircase left -->
  <text x="160" y="42" fill="#c8c8d8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">ADC Quantisation (3-bit shown)</text>
  <line x1="20"  y1="200" x2="300" y2="200" stroke="#4a5470" stroke-width="1.5"/>
  <line x1="20"  y1="40"  x2="20"  y2="200" stroke="#4a5470" stroke-width="1.5"/>
  <!-- Staircase output -->
  <polyline points="20,195 55,195 55,175 90,175 90,155 125,155 125,130 160,130 160,110 195,110 195,90 230,90 230,70 265,70 265,50 300,50"
    fill="none" stroke="#00d4a0" stroke-width="2.5"/>
  <!-- Actual signal (smooth) -->
  <path d="M 20,195 Q 80,160 160,125 Q 240,90 300,50" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Quantisation error shading -->
  <text x="160" y="220" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">ADC output (staircase)</text>
  <text x="160" y="233" fill="#ff6b6b" font-size="8" text-anchor="middle" font-family="monospace">Ideal signal (smooth)</text>
  <text x="160" y="246" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Gap = quantisation noise</text>
  <!-- Y labels (bits) -->
  <text x="16" y="197" fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">000</text>
  <text x="16" y="177" fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">001</text>
  <text x="16" y="157" fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">010</text>
  <text x="16" y="132" fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">011</text>
  <text x="16" y="112" fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">100</text>
  <text x="16" y="92"  fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">101</text>
  <text x="16" y="72"  fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">110</text>
  <text x="16" y="52"  fill="#8892b0" font-size="7" text-anchor="end" font-family="monospace">111</text>

  <!-- dBFS ruler middle -->
  <text x="470" y="42" fill="#c8c8d8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">dBFS Scale — Full Scale Reference</text>
  <rect x="420" y="50" width="50" height="185" fill="#141720" stroke="#4a5470" stroke-width="1" rx="3"/>
  <!-- Color zones -->
  <rect x="420" y="50"  width="50" height="37"  fill="#2a0d0d" rx="2"/>
  <rect x="420" y="87"  width="50" height="74"  fill="#1a1a0d" rx="2"/>
  <rect x="420" y="161" width="50" height="74"  fill="#0d1a0d" rx="2"/>
  <!-- Reference lines -->
  <line x1="470" y1="50"  x2="780" y2="50"  stroke="#ff6b6b" stroke-width="2"/>
  <text x="475" y="64"  fill="#ff6b6b" font-size="9" font-weight="bold" font-family="monospace">0 dBFS = Full Scale (ADC clips above this)</text>
  <line x1="470" y1="87"  x2="780" y2="87"  stroke="#f5a623" stroke-width="1"/>
  <text x="475" y="101" fill="#f5a623" font-size="9" font-family="monospace">-6 dBFS = 6dB headroom (common operating point)</text>
  <line x1="470" y1="124" x2="780" y2="124" stroke="#c8b800" stroke-width="1"/>
  <text x="475" y="138" fill="#c8b800" font-size="9" font-family="monospace">-12 dBFS = typical signal level</text>
  <line x1="470" y1="161" x2="780" y2="161" stroke="#00d4a0" stroke-width="1.5"/>
  <text x="475" y="175" fill="#00d4a0" font-size="9" font-weight="bold" font-family="monospace">-72 dBFS = 12-bit SQNR floor (noise)</text>
  <text x="475" y="188" fill="#4a5470" font-size="8" font-family="monospace">SQNR ≈ 6.02×N + 1.76 = 6.02×12 + 1.76 = 74 dB</text>
  <line x1="470" y1="198" x2="780" y2="198" stroke="#4a5470" stroke-width="1"/>
  <text x="475" y="212" fill="#4a5470" font-size="9" font-family="monospace">-∞ dBFS = 0 (no signal)</text>
  <!-- dBFS to dBm conversion -->
  <rect x="475" y="222" width="300" height="30" fill="#001a00" stroke="#00d4a0" stroke-width="1" rx="3"/>
  <text x="625" y="237" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">dBm = dBFS + ADC_FULLSCALE_dBm</text>
  <text x="625" y="249" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">ADC_FULLSCALE set by calibration (ADC_ADJUST offset)</text>
  <!-- dBFS axis label -->
  <text x="406" y="145" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace" transform="rotate(-90,406,145)">dBFS</text>
</svg>