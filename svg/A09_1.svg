<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="130" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">RuAuto Framework — 3-Layer Architecture</text>
  <rect x="8"   y="28" width="240" height="90" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="128" y="47" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Layer 1: Configuration</text>
  <text x="18"  y="63" fill="#8892b0" font-size="8" font-family="monospace">tc_cadence.json — test cases, limits, DSA</text>
  <text x="18"  y="77" fill="#8892b0" font-size="8" font-family="monospace">hardware.json — ADC_ADJUST, cable loss</text>
  <text x="18"  y="91" fill="#8892b0" font-size="8" font-family="monospace">instrument_config.json — IP addresses</text>
  <text x="18"  y="105" fill="#4a5470" font-size="7" font-family="monospace">Edit these to customise test behaviour</text>
  <line x1="248" y1="73" x2="268" y2="73" stroke="#4a5470" stroke-width="1.5"/>
  <polygon points="266,69 276,73 266,77" fill="#4a5470"/>
  <rect x="276" y="28" width="240" height="90" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="396" y="47" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Layer 2: Orchestration</text>
  <text x="286" y="63" fill="#8892b0" font-size="8" font-family="monospace">ruauto.py — reads config, runs tests</text>
  <text x="286" y="77" fill="#8892b0" font-size="8" font-family="monospace">SCPI → EXM/EXA · CLI → RU · REST → DU</text>
  <text x="286" y="91" fill="#8892b0" font-size="8" font-family="monospace">Applies DSA offsets, waits for DPD, logs</text>
  <text x="286" y="105" fill="#f5a623" font-size="7" font-family="monospace">This layer you rarely touch</text>
  <line x1="516" y1="73" x2="536" y2="73" stroke="#4a5470" stroke-width="1.5"/>
  <polygon points="534,69 544,73 534,77" fill="#4a5470"/>
  <rect x="544" y="28" width="248" height="90" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="668" y="47" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Layer 3: Results</text>
  <text x="554" y="63" fill="#8892b0" font-size="8" font-family="monospace">rct_results_DATE.json — all measurements</text>
  <text x="554" y="77" fill="#8892b0" font-size="8" font-family="monospace">PASS/FAIL per Group-ID → Test-ID</text>
  <text x="554" y="91" fill="#8892b0" font-size="8" font-family="monospace">EXM readings, CLI, DU RSSI per column</text>
  <text x="554" y="105" fill="#f5a623" font-size="7" font-family="monospace">Parse this for post-analysis and reports</text>
</svg>