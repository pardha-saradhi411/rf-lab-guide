<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="260" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">L0 Electronics Foundation — Concepts You Must Know Before RF</text>
  <!-- Grid of concept boxes -->
  <!-- Row 1 -->
  <rect x="10"  y="35" width="115" height="50" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="67"  y="56" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Ohm's Law</text>
  <text x="67"  y="70" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">V = I × R</text>
  <text x="67"  y="82" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">P = V²/R = I²R</text>

  <rect x="135" y="35" width="115" height="50" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="192" y="56" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Kirchhoff's</text>
  <text x="192" y="70" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">KVL: ΣV=0 loop</text>
  <text x="192" y="82" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">KCL: ΣI=0 node</text>

  <rect x="260" y="35" width="115" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="317" y="56" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Impedance Z</text>
  <text x="317" y="70" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">Z = R + jX (Ω)</text>
  <text x="317" y="82" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">50Ω standard RF</text>

  <rect x="385" y="35" width="115" height="50" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="442" y="52" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">dB / dBm / dBc</text>
  <text x="442" y="66" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">dBm=10log(P/1mW)</text>
  <text x="442" y="78" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">dBc=dB re carrier</text>
  <text x="442" y="88" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+3dB=×2, +10=×10</text>

  <rect x="510" y="35" width="115" height="50" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="567" y="56" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">AC vs DC</text>
  <text x="567" y="70" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">AC: oscillates</text>
  <text x="567" y="82" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">RF = high-freq AC</text>

  <rect x="635" y="35" width="155" height="50" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="712" y="56" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">VSWR / Reflection</text>
  <text x="712" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">VSWR=Vmax/Vmin</text>
  <text x="712" y="82" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">1.0=perfect,&gt;2=bad</text>

  <!-- Row 2 -->
  <rect x="10"  y="97" width="115" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="67"  y="118" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Smith Chart</text>
  <text x="67"  y="132" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">Z/Y visualization</text>
  <text x="67"  y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Matching networks</text>

  <rect x="135" y="97" width="115" height="50" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="192" y="118" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Filters</text>
  <text x="192" y="132" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">LPF/HPF/BPF/BSF</text>
  <text x="192" y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Insertion loss, BW</text>

  <rect x="260" y="97" width="115" height="50" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="317" y="118" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Oscillators</text>
  <text x="317" y="132" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">VCO, PLL, TCXO</text>
  <text x="317" y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Phase noise matters</text>

  <rect x="385" y="97" width="115" height="50" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="442" y="118" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Mixers</text>
  <text x="442" y="132" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">fout = fRF ± fLO</text>
  <text x="442" y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Up/down convert</text>

  <rect x="510" y="97" width="115" height="50" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="567" y="118" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Power</text>
  <text x="567" y="132" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">P=V²/R, P=I²R</text>
  <text x="567" y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Average vs Peak</text>

  <rect x="635" y="97" width="155" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="712" y="118" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">S-Parameters</text>
  <text x="712" y="132" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">S11=return loss</text>
  <text x="712" y="144" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">S21=insertion loss</text>

  <!-- Key principle -->
  <rect x="10" y="158" width="780" height="30" fill="#001a00" stroke="#00d4a0" stroke-width="1" rx="4"/>
  <text x="400" y="170" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Everything in RF builds on these. Shaky foundation = wrong troubleshooting. Master these before touching an instrument.</text>
  <text x="400" y="183" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Your daily use: dBm (power readings) · VSWR (antenna match) · S11/S21 (VNA measurements) · Mixer (your downconverter in EXA)</text>

  <!-- dB quick ref -->
  <text x="10"  y="210" fill="#f5a623" font-size="9" font-family="monospace">dB Quick Reference:</text>
  <text x="10"  y="223" fill="#8892b0" font-size="9" font-family="monospace">+3dB = ×2 power   +10dB = ×10 power   +20dB = ×100 power   +30dB = ×1000 power</text>
  <text x="10"  y="236" fill="#8892b0" font-size="9" font-family="monospace">-3dB = ÷2 power   -10dB = ÷10 power   -20dB = ÷100 power   -30dB = ÷1000 power</text>
  <text x="10"  y="249" fill="#4a5470" font-size="8" font-family="monospace">0 dBm = 1 mW   +30 dBm = 1 W   +43 dBm = 20 W (your B1 output)   -174 dBm/Hz = thermal noise floor</text>
</svg>