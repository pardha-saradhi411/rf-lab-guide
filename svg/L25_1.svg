<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="130" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Temperature Effects — RF Performance Across Operating Range</text>
  <rect x="8"   y="28" width="186" height="90" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="101" y="48" fill="#5bc4ef" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">−40°C</text>
  <text x="18"  y="65" fill="#8892b0" font-size="8" font-family="monospace">PA gain: +1 to +2 dB ↑</text>
  <text x="18"  y="79" fill="#8892b0" font-size="8" font-family="monospace">ACLR: may worsen (DPD)</text>
  <text x="18"  y="93" fill="#ff6b6b" font-size="8" font-family="monospace">Risk: PA over-power</text>
  <text x="18"  y="107" fill="#f5a623" font-size="7" font-family="monospace">DPD coeffs need re-converge</text>
  <rect x="204" y="28" width="186" height="90" fill="#0d1a0d" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="297" y="48" fill="#00d4a0" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">+25°C</text>
  <text x="214" y="65" fill="#8892b0" font-size="8" font-family="monospace">Reference / calibration point</text>
  <text x="214" y="79" fill="#8892b0" font-size="8" font-family="monospace">All specs at nominal</text>
  <text x="214" y="93" fill="#8892b0" font-size="8" font-family="monospace">DPD converges normally</text>
  <text x="214" y="107" fill="#00d4a0" font-size="7" font-family="monospace">Factory cal reference temp</text>
  <rect x="400" y="28" width="186" height="90" fill="#1a1a0d" stroke="#c8b800" stroke-width="2" rx="4"/>
  <text x="493" y="48" fill="#c8b800" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">+55°C</text>
  <text x="410" y="65" fill="#8892b0" font-size="8" font-family="monospace">PA gain: −1 to −2 dB ↓</text>
  <text x="410" y="79" fill="#8892b0" font-size="8" font-family="monospace">RSSI drifts without TEMP_COMP</text>
  <text x="410" y="93" fill="#f5a623" font-size="8" font-family="monospace">TEMP_COMP table must be active</text>
  <text x="410" y="107" fill="#4a5470" font-size="7" font-family="monospace">Common failure: RSSI off by 1-2 dB</text>
  <rect x="596" y="28" width="196" height="90" fill="#2a0d0d" stroke="#ff6b6b" stroke-width="2.5" rx="4"/>
  <text x="694" y="48" fill="#ff6b6b" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">+70°C</text>
  <text x="606" y="65" fill="#8892b0" font-size="8" font-family="monospace">PA thermal protection fires</text>
  <text x="606" y="79" fill="#8892b0" font-size="8" font-family="monospace">TX power derated or off</text>
  <text x="606" y="93" fill="#ff6b6b" font-size="8" font-family="monospace">DPD model breaks down</text>
  <text x="606" y="107" fill="#ff6b6b" font-size="7" font-family="monospace">Permanent damage risk &gt;85°C junction</text>
</svg>