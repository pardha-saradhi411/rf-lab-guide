<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="200" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Noise Floor — From First Principles to Your RU Sensitivity</text>
  <!-- Building blocks left to right -->
  <rect x="10" y="40" width="100" height="60" fill="#1a0d2a" stroke="#9b8cf8" stroke-width="1.5" rx="3"/>
  <text x="60" y="62" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">kTB floor</text>
  <text x="60" y="77" fill="#c8c8d8" font-size="10" text-anchor="middle" font-family="monospace">−174 dBm/Hz</text>
  <text x="60" y="92" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">absolute physics</text>
  <text x="60" y="80" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace"> </text>
  <line x1="110" y1="70" x2="130" y2="70" stroke="#9b8cf8" stroke-width="1.5"/>
  <text x="120" y="63" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+10log(BW)</text>

  <rect x="130" y="40" width="100" height="60" fill="#1a0d2a" stroke="#9b8cf8" stroke-width="1.5" rx="3"/>
  <text x="180" y="62" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Noise floor</text>
  <text x="180" y="77" fill="#c8c8d8" font-size="10" text-anchor="middle" font-family="monospace">−104 dBm</text>
  <text x="180" y="92" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">10 MHz BW</text>
  <line x1="230" y1="70" x2="250" y2="70" stroke="#f5a623" stroke-width="1.5"/>
  <text x="240" y="63" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+NF(5.75)</text>

  <rect x="250" y="40" width="115" height="60" fill="#1a1a0d" stroke="#f5a623" stroke-width="1.5" rx="3"/>
  <text x="307" y="62" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">System floor</text>
  <text x="307" y="77" fill="#c8c8d8" font-size="10" text-anchor="middle" font-family="monospace">−98.25 dBm</text>
  <text x="307" y="92" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+NF degradation</text>
  <line x1="365" y1="70" x2="385" y2="70" stroke="#00d4a0" stroke-width="1.5"/>
  <text x="375" y="63" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+SNR(−1)</text>

  <rect x="385" y="30" width="130" height="80" fill="#001a00" stroke="#00d4a0" stroke-width="2.5" rx="3"/>
  <text x="450" y="52" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Sensitivity</text>
  <text x="450" y="70" fill="#00d4a0" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">−99.25 dBm</text>
  <text x="450" y="87" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">B1, 10MHz, QPSK 1/3</text>
  <text x="450" y="100" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">30dB better than 3GPP!</text>
  <line x1="515" y1="70" x2="535" y2="70" stroke="#4a5470" stroke-width="1.5"/>
  <text x="525" y="63" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">−base</text>

  <rect x="535" y="40" width="100" height="60" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="3"/>
  <text x="585" y="62" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">DSA offset</text>
  <text x="585" y="77" fill="#c8c8d8" font-size="10" text-anchor="middle" font-family="monospace">B1 = 5 dB</text>
  <text x="585" y="92" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">vs B3 baseline</text>
  <line x1="635" y1="70" x2="655" y2="70" stroke="#5bc4ef" stroke-width="1.5"/>
  <text x="645" y="63" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+base</text>

  <rect x="655" y="40" width="130" height="60" fill="#2a0000" stroke="#ff6b6b" stroke-width="2" rx="3"/>
  <text x="720" y="62" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">EXM injects</text>
  <text x="720" y="77" fill="#c8c8d8" font-size="10" text-anchor="middle" font-family="monospace">−87 + 5 = −82 dBm</text>
  <text x="720" y="92" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">PRACH threshold</text>

  <text x="400" y="135" fill="#4a5470" font-size="9" text-anchor="middle" font-family="monospace">Every step is measurable — you can verify each block by measuring RU noise floor with EXA (preamp ON, 0dB atten)</text>
  <text x="400" y="150" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">EXA DANL (−130 dBm/Hz) must be &lt; RU noise floor (−104+NF ≈ −98 dBm in 10MHz) — otherwise EXA limits your measurement</text>
  <text x="400" y="167" fill="#f5a623" font-size="9" text-anchor="middle" font-family="monospace">Check: EXA floor at −130 dBm/Hz × 10MHz = −130+70 = −60 dBm — safely below your −98 dBm system floor ✓</text>
  <text x="400" y="182" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">If EXA floor exceeded RU floor, you'd be measuring the analyser noise, not the RU — always check before RSSI cal</text>
</svg>