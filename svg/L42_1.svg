<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="220" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">AI for RF — Current and Near-Future Applications</text>

  <rect x="10"  y="35" width="175" height="100" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="97"  y="53" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">AI-DPD</text>
  <text x="20"  y="68" fill="#8892b0" font-size="8" font-family="monospace">Neural network replaces</text>
  <text x="20"  y="80" fill="#8892b0" font-size="8" font-family="monospace">traditional LUT-based DPD</text>
  <text x="20"  y="93" fill="#f5a623" font-size="8" font-family="monospace">Better adaptation speed</text>
  <text x="20"  y="105" fill="#f5a623" font-size="8" font-family="monospace">Handles memory effects</text>
  <text x="20"  y="118" fill="#4a5470" font-size="7" font-family="monospace">Research: Samsung, Ericsson</text>
  <text x="20"  y="128" fill="#4a5470" font-size="7" font-family="monospace">Key: 3-5dB ACLR improvement</text>

  <rect x="195" y="35" width="175" height="100" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="282" y="53" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">AI Fault Prediction</text>
  <text x="205" y="68" fill="#8892b0" font-size="8" font-family="monospace">Train on historical fault logs</text>
  <text x="205" y="80" fill="#8892b0" font-size="8" font-family="monospace">Predict failures before they</text>
  <text x="205" y="92" fill="#8892b0" font-size="8" font-family="monospace">occur → proactive maintenance</text>
  <text x="205" y="105" fill="#f5a623" font-size="8" font-family="monospace">Input: temp, power, VSWR trends</text>
  <text x="205" y="118" fill="#4a5470" font-size="7" font-family="monospace">Output: "PA likely to fail in 48h"</text>

  <rect x="380" y="35" width="175" height="100" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="467" y="53" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">AI Beam Optimization</text>
  <text x="390" y="68" fill="#8892b0" font-size="8" font-family="monospace">Learn user mobility patterns</text>
  <text x="390" y="80" fill="#8892b0" font-size="8" font-family="monospace">Predict optimal beam before</text>
  <text x="390" y="92" fill="#8892b0" font-size="8" font-family="monospace">UE even moves</text>
  <text x="390" y="105" fill="#f5a623" font-size="8" font-family="monospace">Reduces beam failure events</text>
  <text x="390" y="118" fill="#4a5470" font-size="7" font-family="monospace">O-RAN rApp/xApp framework</text>

  <rect x="565" y="35" width="225" height="100" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="677" y="53" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">AI Power Optimization</text>
  <text x="575" y="68" fill="#8892b0" font-size="8" font-family="monospace">Dynamic traffic prediction →</text>
  <text x="575" y="80" fill="#8892b0" font-size="8" font-family="monospace">pre-scale uSleep/Vdd levels</text>
  <text x="575" y="92" fill="#8892b0" font-size="8" font-family="monospace">before traffic arrives</text>
  <text x="575" y="105" fill="#f5a623" font-size="8" font-family="monospace">5-15% additional power saving</text>
  <text x="575" y="118" fill="#4a5470" font-size="7" font-family="monospace">Ericsson Energy Saver feature</text>

  <rect x="10" y="145" width="780" height="65" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="400" y="163" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Why this matters for your career:</text>
  <text x="20"  y="179" fill="#8892b0" font-size="9" font-family="monospace">AI for RF is the fastest-growing area in 5G/6G. Ericsson, Nokia, Qualcomm all have AI teams working on RF problems.</text>
  <text x="20"  y="193" fill="#8892b0" font-size="9" font-family="monospace">An RF engineer who also understands ML (feature extraction from RF data, anomaly detection, regression models) is extremely rare and valuable.</text>
  <text x="20"  y="207" fill="#4a5470" font-size="8" font-family="monospace">Start with: Python sklearn · logistic regression on fault log data · LSTM for time-series RSSI prediction · These skills set you apart at interviews.</text>
</svg>