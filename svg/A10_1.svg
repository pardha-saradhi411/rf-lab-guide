<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="200" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">A10: Troubleshooting Methodology — 5-Why Root Cause Analysis</text>
  <!-- 5-Why chain -->
  <rect x="10"  y="35" width="130" height="145" fill="#2a0d0d" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="75"  y="55" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Symptom</text>
  <text x="75"  y="70" fill="#ff6b6b" font-size="9" text-anchor="middle" font-family="monospace">⚠ ACLR fail</text>
  <text x="75"  y="85" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">ACLR = −42 dBc</text>
  <text x="75"  y="100" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Limit = −45 dBc</text>
  <text x="75"  y="118" fill="#f5a623" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Why #1:</text>
  <text x="75"  y="131" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">PA nonlinearity</text>
  <text x="75"  y="144" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">high distortion</text>
  <text x="75"  y="160" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">→ spectral regrowth</text>
  <line x1="140" y1="107" x2="155" y2="107" stroke="#f5a623" stroke-width="2"/>
  <polygon points="153,103 163,107 153,111" fill="#f5a623"/>

  <rect x="163" y="35" width="130" height="145" fill="#1a0d0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="228" y="55" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Why #2:</text>
  <text x="228" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">DPD not working</text>
  <text x="228" y="83" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">PA not linearised</text>
  <text x="228" y="100" fill="#f5a623" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Why #3:</text>
  <text x="228" y="115" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">DPD not converged</text>
  <text x="228" y="128" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">after power change</text>
  <text x="228" y="145" fill="#f5a623" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Why #4:</text>
  <text x="228" y="160" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Measured too soon</text>
  <text x="228" y="173" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">DPD needs 60s</text>
  <line x1="293" y1="107" x2="308" y2="107" stroke="#f5a623" stroke-width="2"/>
  <polygon points="306,103 316,107 306,111" fill="#f5a623"/>

  <rect x="316" y="35" width="130" height="145" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="381" y="55" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Why #5:</text>
  <text x="381" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">No wait after</text>
  <text x="381" y="83" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">power register</text>
  <text x="381" y="96" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">change</text>
  <text x="381" y="115" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Root Cause:</text>
  <text x="381" y="130" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">Test procedure</text>
  <text x="381" y="143" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">missing 60s wait</text>
  <text x="381" y="162" fill="#f5a623" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Fix:</text>
  <text x="381" y="175" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Add sleep(60) to</text>

  <!-- Other failure trees -->
  <rect x="460" y="35" width="330" height="145" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="625" y="52" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Other failure trees (apply same method):</text>
  <text x="470" y="68"  fill="#ff6b6b" font-size="8" font-family="monospace">EVM fail → DPD / cable / LO / IQ imbalance</text>
  <text x="470" y="83"  fill="#ff6b6b" font-size="8" font-family="monospace">TX power low → PA bias / calibration file / V ATT</text>
  <text x="470" y="98"  fill="#ff6b6b" font-size="8" font-family="monospace">RSSI wrong → ADC_ADJUST / cable loss / temp</text>
  <text x="470" y="113" fill="#ff6b6b" font-size="8" font-family="monospace">Sensitivity bad → NF / LNA / duplexer / DSA wrong</text>
  <text x="470" y="128" fill="#ff6b6b" font-size="8" font-family="monospace">PA protection → temp / VSWR / over-current reg</text>
  <line x1="470" y1="137" x2="785" y2="137" stroke="#4a5470" stroke-width="0.5"/>
  <text x="625" y="153" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">Rule: change ONE variable at a time</text>
  <text x="625" y="167" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">Document before/after every change</text>
  <text x="625" y="181" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Root cause = smallest change that explains ALL symptoms</text>
</svg>