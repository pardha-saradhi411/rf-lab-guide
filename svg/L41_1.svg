<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="120" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Telecom Business — Why RF Quality Has Financial Consequences</text>
  <rect x="8"   y="28" width="240" height="80" fill="#0d1a0d" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="128" y="48" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Bad ACLR → Business Impact</text>
  <text x="18"  y="65" fill="#ff6b6b" font-size="9" font-family="monospace">ACLR −42 dBc (fails −45 limit)</text>
  <text x="18"  y="79" fill="#8892b0" font-size="8" font-family="monospace">↓ Adjacent channel interference</text>
  <text x="18"  y="93" fill="#8892b0" font-size="8" font-family="monospace">↓ SINR down → MCS down → throughput down</text>
  <text x="18"  y="107" fill="#f5a623" font-size="7" font-family="monospace">Regulator fine + operator SLA penalty</text>
  <rect x="258" y="28" width="240" height="80" fill="#1a1a0d" stroke="#c8b800" stroke-width="2" rx="4"/>
  <text x="378" y="48" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Energy Efficiency</text>
  <text x="268" y="65" fill="#8892b0" font-size="8" font-family="monospace">Base stations = 2% world electricity</text>
  <text x="268" y="79" fill="#8892b0" font-size="8" font-family="monospace">uSleep: saves ~70% idle power</text>
  <text x="268" y="93" fill="#8892b0" font-size="8" font-family="monospace">Dynamic Vdd: saves ~15% average</text>
  <text x="268" y="107" fill="#f5a623" font-size="7" font-family="monospace">10k sites × 2kW × $0.10/kWh = $17M/yr</text>
  <rect x="508" y="28" width="284" height="80" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="650" y="48" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">CAPEX vs OPEX</text>
  <text x="518" y="65" fill="#8892b0" font-size="8" font-family="monospace">CAPEX: hardware + installation (one-time)</text>
  <text x="518" y="79" fill="#8892b0" font-size="8" font-family="monospace">OPEX: power + maintenance (per year)</text>
  <text x="518" y="93" fill="#8892b0" font-size="8" font-family="monospace">10-yr TCO: OPEX often &gt; CAPEX</text>
  <text x="518" y="107" fill="#f5a623" font-size="7" font-family="monospace">Efficient RU = lower 10-yr total cost</text>
</svg>