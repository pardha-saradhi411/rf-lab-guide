<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="240" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">L4 RF Signal Chain — TX (top) and RX (bottom)</text>

  <!-- TX Chain -->
  <text x="10" y="42" fill="#ff6b6b" font-size="10" font-weight="bold" font-family="monospace">TX PATH →</text>
  <!-- Blocks -->
  <rect x="55"  y="48" width="65" height="38" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="87"  y="64" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">BBU/DU</text>
  <text x="87"  y="78" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Digital data</text>

  <line x1="120" y1="67" x2="130" y2="67" stroke="#ff6b6b" stroke-width="1.5"/>

  <rect x="130" y="48" width="65" height="38" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="162" y="64" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">DAC</text>
  <text x="162" y="78" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Digital→Analog</text>

  <line x1="195" y1="67" x2="205" y2="67" stroke="#f5a623" stroke-width="1.5"/>

  <rect x="205" y="48" width="65" height="38" fill="#1a1a0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="237" y="64" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">IQ/DFE</text>
  <text x="237" y="78" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">CFR→DPD</text>

  <line x1="270" y1="67" x2="280" y2="67" stroke="#f5a623" stroke-width="1.5"/>

  <rect x="280" y="48" width="65" height="38" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="312" y="64" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Mixer</text>
  <text x="312" y="78" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+LO upconvert</text>

  <line x1="345" y1="67" x2="355" y2="67" stroke="#c8b800" stroke-width="1.5"/>

  <rect x="355" y="48" width="65" height="38" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="387" y="62" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">PLL/VCO</text>
  <text x="387" y="74" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Local Osc.</text>
  <text x="387" y="83" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">freq synth</text>

  <line x1="420" y1="67" x2="430" y2="67" stroke="#9b8cf8" stroke-width="1.5"/>

  <rect x="430" y="48" width="65" height="38" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="462" y="62" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">V ATT</text>
  <text x="462" y="74" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Power control</text>
  <text x="462" y="83" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">variable gain</text>

  <line x1="495" y1="67" x2="505" y2="67" stroke="#ff6b6b" stroke-width="1.5"/>

  <rect x="505" y="40" width="75" height="54" fill="#2a0000" stroke="#ff6b6b" stroke-width="2.5" rx="4"/>
  <text x="542" y="60" fill="#ff6b6b" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">PA</text>
  <text x="542" y="74" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">GaN HEMT</text>
  <text x="542" y="86" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">+40dB gain</text>

  <line x1="580" y1="67" x2="590" y2="67" stroke="#5bc4ef" stroke-width="1.5"/>

  <rect x="590" y="48" width="75" height="38" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="627" y="64" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Coupler</text>
  <text x="627" y="78" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">DPD obs. tap</text>

  <line x1="665" y1="67" x2="675" y2="67" stroke="#5bc4ef" stroke-width="1.5"/>

  <rect x="675" y="48" width="75" height="38" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="712" y="62" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Duplexer</text>
  <text x="712" y="74" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">TX/RX split</text>
  <text x="712" y="83" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">→ Antenna</text>

  <!-- RX Chain (reverse, below) -->
  <text x="10" y="128" fill="#00d4a0" font-size="10" font-weight="bold" font-family="monospace">RX PATH ←</text>

  <rect x="55"  y="135" width="65" height="38" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="87"  y="151" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">ADC</text>
  <text x="87"  y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">12-bit →DU</text>

  <line x1="120" y1="154" x2="130" y2="154" stroke="#00d4a0" stroke-width="1.5"/>

  <rect x="130" y="135" width="65" height="38" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="162" y="151" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">VGA/AGC</text>
  <text x="162" y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Gain control</text>

  <line x1="195" y1="154" x2="205" y2="154" stroke="#5bc4ef" stroke-width="1.5"/>

  <rect x="205" y="135" width="65" height="38" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="237" y="151" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Mixer</text>
  <text x="237" y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Downconvert</text>

  <line x1="270" y1="154" x2="280" y2="154" stroke="#9b8cf8" stroke-width="1.5"/>

  <rect x="280" y="135" width="65" height="38" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="312" y="151" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">BPF</text>
  <text x="312" y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Post-LNA filter</text>

  <line x1="345" y1="154" x2="355" y2="154" stroke="#f5a623" stroke-width="1.5"/>

  <rect x="355" y="127" width="75" height="54" fill="#001a00" stroke="#00d4a0" stroke-width="2.5" rx="4"/>
  <text x="392" y="147" fill="#00d4a0" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">LNA</text>
  <text x="392" y="161" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">NF=2dB</text>
  <text x="392" y="173" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">G=+20dB</text>

  <line x1="430" y1="154" x2="440" y2="154" stroke="#f5a623" stroke-width="1.5"/>

  <rect x="440" y="135" width="65" height="38" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="472" y="151" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Pre-BPF</text>
  <text x="472" y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Before LNA</text>

  <line x1="505" y1="154" x2="515" y2="154" stroke="#c8b800" stroke-width="1.5"/>

  <rect x="515" y="135" width="75" height="38" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="552" y="151" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Duplexer</text>
  <text x="552" y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">0.5dB NF hit</text>

  <line x1="590" y1="154" x2="600" y2="154" stroke="#5bc4ef" stroke-width="1.5"/>

  <rect x="600" y="135" width="75" height="38" fill="#0d0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="637" y="151" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Antenna</text>
  <text x="637" y="165" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Collects RF</text>

  <!-- NF annotation -->
  <text x="400" y="200" fill="#ff6b6b" font-size="9" text-anchor="middle" font-family="monospace">RX NF chain: Duplexer(0.5dB) → Pre-BPF(0.3dB) → LNA(2dB, sets everything) → BPF(0.01dB÷100) → Mixer(0.05dB÷100) → Total≈5.75dB</text>
  <text x="400" y="215" fill="#f5a623" font-size="9" text-anchor="middle" font-family="monospace">Everything BEFORE LNA adds full NF penalty · Everything AFTER LNA is divided by LNA gain (×100)</text>
  <text x="400" y="230" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Sensitivity = -174 + 10log(BW) + NF + Required_SNR = -174 + 70 + 5.75 + (-1) = -99.25 dBm for B1 10MHz</text>
</svg>