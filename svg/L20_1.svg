<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="260" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Synchronisation Hierarchy — GPS → Network → RU</text>

  <!-- GPS/GNSS source -->
  <rect x="320" y="35" width="160" height="35" fill="#1a1a0d" stroke="#c8b800" stroke-width="2" rx="4"/>
  <text x="400" y="53" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">🛰 GPS/GNSS</text>
  <text x="400" y="65" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">±100ns absolute time reference</text>

  <line x1="400" y1="70" x2="400" y2="88" stroke="#c8b800" stroke-width="1.5"/>

  <!-- Grandmaster clock -->
  <rect x="280" y="88" width="240" height="30" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="400" y="107" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Grandmaster Clock (PTP)</text>

  <line x1="400" y1="118" x2="400" y2="135" stroke="#5bc4ef" stroke-width="1.5"/>

  <!-- PTP/SyncE path -->
  <rect x="250" y="135" width="300" height="30" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="400" y="150" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Boundary/Transparent Clock</text>
  <text x="400" y="162" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">PTP IEEE 1588v2 + SyncE (frequency)</text>

  <line x1="400" y1="165" x2="400" y2="183" stroke="#9b8cf8" stroke-width="1.5"/>

  <!-- O-DU -->
  <rect x="280" y="183" width="240" height="30" fill="#1a1a0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="400" y="201" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">O-DU (FHGW)</text>

  <line x1="400" y1="213" x2="400" y2="230" stroke="#00d4a0" stroke-width="2"/>

  <!-- O-RU -->
  <rect x="280" y="230" width="240" height="22" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="400" y="244" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">O-RU — ±1.5μs phase accuracy</text>

  <!-- Sync types right side -->
  <rect x="650" y="60" width="140" height="100" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="720" y="78"  fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">3 Sync Types:</text>
  <text x="660" y="95"  fill="#5bc4ef" font-size="9" font-family="monospace">Freq: SyncE ±50ppb</text>
  <text x="660" y="110" fill="#9b8cf8" font-size="9" font-family="monospace">Phase: PTP ±1.5μs</text>
  <text x="660" y="125" fill="#c8b800" font-size="9" font-family="monospace">Time: GPS absolute</text>
  <text x="660" y="145" fill="#ff6b6b" font-size="8" font-family="monospace">TDD needs phase sync!</text>
  <text x="660" y="157" fill="#4a5470" font-size="7" font-family="monospace">FDD: freq sync enough</text>

  <!-- Holdover box -->
  <rect x="10" y="60" width="140" height="80" fill="#2a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="80" y="78"  fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">⚠ Holdover</text>
  <text x="20" y="93"  fill="#8892b0" font-size="8" font-family="monospace">GPS/PTP source lost</text>
  <text x="20" y="106" fill="#8892b0" font-size="8" font-family="monospace">RU uses internal OCXO</text>
  <text x="20" y="119" fill="#f5a623" font-size="8" font-family="monospace">Drift: ±100ns/hr typ</text>
  <text x="20" y="131" fill="#ff6b6b" font-size="8" font-family="monospace">TDD fails after hours</text>
</svg>