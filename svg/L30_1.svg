<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="120" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Transport — eCPRI Fronthaul to Core Backhaul</text>
  <rect x="8"   y="28" width="150" height="82" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="83"  y="48" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">O-RU (AAU)</text>
  <text x="18"  y="64" fill="#8892b0" font-size="8" font-family="monospace">eCPRI user plane (IQ)</text>
  <text x="18"  y="78" fill="#8892b0" font-size="8" font-family="monospace">PTP sync + NETCONF</text>
  <text x="18"  y="92" fill="#f5a623" font-size="7" font-family="monospace">10GbE SFP+ port</text>
  <line x1="158" y1="69" x2="188" y2="69" stroke="#4a5470" stroke-width="2"/>
  <text x="173" y="60" fill="#5bc4ef" font-size="7" text-anchor="middle" font-family="monospace">Fronthaul</text>
  <text x="173" y="82" fill="#4a5470" font-size="6" text-anchor="middle" font-family="monospace">&lt;100μs latency</text>
  <rect x="188" y="28" width="150" height="82" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="263" y="48" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">FHGW / Switch</text>
  <text x="198" y="64" fill="#8892b0" font-size="8" font-family="monospace">PTP transparent clock</text>
  <text x="198" y="78" fill="#8892b0" font-size="8" font-family="monospace">VLAN + QoS priority</text>
  <text x="198" y="92" fill="#f5a623" font-size="7" font-family="monospace">eCPRI = highest priority</text>
  <line x1="338" y1="69" x2="368" y2="69" stroke="#4a5470" stroke-width="2"/>
  <rect x="368" y="28" width="150" height="82" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="443" y="48" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">O-DU</text>
  <text x="378" y="64" fill="#8892b0" font-size="8" font-family="monospace">eCPRI termination</text>
  <text x="378" y="78" fill="#8892b0" font-size="8" font-family="monospace">PTP grandmaster (GPS)</text>
  <text x="378" y="92" fill="#f5a623" font-size="7" font-family="monospace">NETCONF client</text>
  <line x1="518" y1="69" x2="548" y2="69" stroke="#4a5470" stroke-width="2"/>
  <text x="533" y="60" fill="#9b8cf8" font-size="7" text-anchor="middle" font-family="monospace">Backhaul</text>
  <rect x="548" y="28" width="244" height="82" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="2" rx="4"/>
  <text x="670" y="48" fill="#9b8cf8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Core / O-CU</text>
  <text x="558" y="64" fill="#8892b0" font-size="8" font-family="monospace">PDCP/RRC + user data</text>
  <text x="558" y="78" fill="#8892b0" font-size="8" font-family="monospace">Standard IP/MPLS/fibre</text>
  <text x="558" y="92" fill="#4a5470" font-size="7" font-family="monospace">Any latency acceptable</text>
</svg>