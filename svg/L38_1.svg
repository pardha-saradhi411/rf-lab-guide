<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="240" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">KPI Correlation — How RF Failures Become Customer Complaints</text>

  <!-- Chain: ACLR → Throughput -->
  <rect x="10"  y="40" width="100" height="50" fill="#2a0d0d" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="60"  y="60" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Bad ACLR</text>
  <text x="60"  y="73" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">&lt;45 dBc</text>
  <text x="60"  y="84" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">spectral leak</text>

  <line x1="110" y1="65" x2="125" y2="65" stroke="#ff6b6b" stroke-width="2"/>
  <polygon points="123,61 133,65 123,69" fill="#ff6b6b"/>

  <rect x="133" y="40" width="100" height="50" fill="#2a1a0d" stroke="#f5a623" stroke-width="1.5" rx="4"/>
  <text x="183" y="60" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Interference</text>
  <text x="183" y="73" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">adjacent cell</text>
  <text x="183" y="84" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">raised noise floor</text>

  <line x1="233" y1="65" x2="248" y2="65" stroke="#f5a623" stroke-width="2"/>
  <polygon points="246,61 256,65 246,69" fill="#f5a623"/>

  <rect x="256" y="40" width="100" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="306" y="60" fill="#c8b800" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Low SINR</text>
  <text x="306" y="73" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">signal+noise</text>
  <text x="306" y="84" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">ratio drops</text>

  <line x1="356" y1="65" x2="371" y2="65" stroke="#c8b800" stroke-width="2"/>
  <polygon points="369,61 379,65 369,69" fill="#c8b800"/>

  <rect x="379" y="40" width="100" height="50" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="429" y="60" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Low CQI</text>
  <text x="429" y="73" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">UE reports</text>
  <text x="429" y="84" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">bad channel</text>

  <line x1="479" y1="65" x2="494" y2="65" stroke="#00d4a0" stroke-width="2"/>
  <polygon points="492,61 502,65 492,69" fill="#00d4a0"/>

  <rect x="502" y="40" width="100" height="50" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="552" y="57" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Lower MCS</text>
  <text x="552" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">DL: 64QAM→</text>
  <text x="552" y="82" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">QPSK forced</text>

  <line x1="602" y1="65" x2="617" y2="65" stroke="#5bc4ef" stroke-width="2"/>
  <polygon points="615,61 625,65 615,69" fill="#5bc4ef"/>

  <rect x="625" y="40" width="165" height="50" fill="#2a0000" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="707" y="57" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">↓ Throughput</text>
  <text x="707" y="70" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">100 Mbps → 10 Mbps</text>
  <text x="707" y="82" fill="#ff6b6b" font-size="8" text-anchor="middle" font-family="monospace">Customer complains!</text>

  <!-- EVM chain -->
  <text x="400" y="115" fill="#c8c8d8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">High EVM → Same cascade:</text>
  <text x="400" y="130" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">High EVM → UE sees noisy signal → low SINR → eNB forced to use lower MCS → throughput drops</text>
  <text x="400" y="145" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">High EVM also → BLER rises → more HARQ retransmissions → latency increases → user experience suffers</text>

  <!-- Why operator cares -->
  <rect x="10" y="160" width="780" height="72" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="400" y="178" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Why Operators Care (Telecom Business Context):</text>
  <text x="20"  y="194" fill="#8892b0" font-size="9" font-family="monospace">ACLR: Regulator (FCC/CE) mandates &gt;45dBc → violation = fine + shutdown. Operator needs compliance certificate.</text>
  <text x="20"  y="207" fill="#8892b0" font-size="9" font-family="monospace">EVM: Directly limits maximum throughput. Can't use 256QAM if EVM&gt;3.5%. Peak data rate capability = competitive advantage.</text>
  <text x="20"  y="220" fill="#8892b0" font-size="9" font-family="monospace">Power savings: uSleep/Dynamic Vdd → 30-40% power reduction → saves OPEX (electricity). Ericsson quotes €millions saved per year per RAN.</text>
  <text x="20"  y="232" fill="#4a5470" font-size="8" font-family="monospace">Sensitivity: Better sensitivity = larger cell radius = fewer sites needed = lower CAPEX. -3dB better sens = cell area doubles (line of sight).</text>
</svg>