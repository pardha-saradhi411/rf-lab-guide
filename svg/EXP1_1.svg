<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
  <rect width="800" height="220" fill="#0d0f14" rx="8"/>
  <text x="400" y="20" fill="#c8c8d8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Spectrum Analyser — RBW, VBW, DANL, Dynamic Range, Sweep</text>

  <!-- Spectrum display with annotations -->
  <rect x="20" y="35" width="420" height="155" fill="#001400" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <!-- Signal -->
  <path d="M 30,175 L 30,170 Q 120,80 160,75 Q 200,80 290,170 L 430,175 Z" fill="#5bc4ef20"/>
  <path d="M 30,175 Q 80,170 120,130 Q 145,80 160,75 Q 175,80 200,130 Q 240,170 290,175" fill="none" stroke="#5bc4ef" stroke-width="2"/>
  <!-- Noise floor -->
  <path d="M 30,162 Q 100,160 160,161 Q 220,162 290,160 Q 360,162 430,161" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- RBW annotation -->
  <line x1="120" y1="100" x2="200" y2="100" stroke="#f5a623" stroke-width="1.5"/>
  <line x1="120" y1="95"  x2="120" y2="105" stroke="#f5a623" stroke-width="1.5"/>
  <line x1="200" y1="95"  x2="200" y2="105" stroke="#f5a623" stroke-width="1.5"/>
  <text x="160" y="93"  fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">RBW</text>
  <!-- Labels -->
  <text x="160" y="55"  fill="#5bc4ef" font-size="8" text-anchor="middle" font-family="monospace">Signal peak</text>
  <text x="380" y="158" fill="#ff6b6b" font-size="7" font-family="monospace">DANL (noise floor)</text>
  <text x="30"  y="47"  fill="#4a5470" font-size="7" font-family="monospace">dBm</text>
  <text x="380" y="188" fill="#4a5470" font-size="7" font-family="monospace">Freq →</text>

  <!-- Settings table -->
  <rect x="455" y="35" width="335" height="155" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="622" y="53" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Key Settings</text>
  <text x="465" y="70"  fill="#5bc4ef" font-size="9" font-weight="bold" font-family="monospace">RBW (Resolution BW):</text>
  <text x="465" y="82"  fill="#8892b0" font-size="8" font-family="monospace">Width of measurement filter</text>
  <text x="465" y="93"  fill="#8892b0" font-size="8" font-family="monospace">Narrower = lower DANL, slower sweep</text>
  <text x="465" y="104" fill="#f5a623" font-size="8" font-family="monospace">ACLR: use RBW=100kHz (3GPP)</text>
  <text x="465" y="118" fill="#00d4a0" font-size="9" font-weight="bold" font-family="monospace">DANL (Displayed Avg Noise Level):</text>
  <text x="465" y="130" fill="#8892b0" font-size="8" font-family="monospace">EXA sensitivity floor (instrument NF)</text>
  <text x="465" y="141" fill="#8892b0" font-size="8" font-family="monospace">DANL ∝ RBW: DANL_2 = DANL_1 + 10log(RBW_2/RBW_1)</text>
  <text x="465" y="155" fill="#9b8cf8" font-size="9" font-weight="bold" font-family="monospace">VBW (Video BW):</text>
  <text x="465" y="167" fill="#8892b0" font-size="8" font-family="monospace">Smoothing filter — lower VBW = smoother trace</text>
  <text x="465" y="178" fill="#f5a623" font-size="8" font-family="monospace">Rule: VBW ≥ RBW for ACLR accuracy</text>

  <text x="400" y="205" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Dynamic range = DANL to max safe input · Increase atten to protect input · Decrease atten for better DANL · Use preamp for weak signal measurements</text>
</svg>