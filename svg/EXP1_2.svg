<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:14px 0 8px">
  <rect width="800" height="150" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">PLL Block Diagram — How Carrier Frequency is Generated</text>
  <!-- GPS ref -->
  <rect x="8" y="35" width="90" height="50" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="3"/>
  <text x="53" y="55" fill="#9b8cf8" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">GPS/GNSS</text>
  <text x="53" y="68" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">10 MHz ref</text>
  <text x="53" y="80" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">±50 ppb acc</text>
  <line x1="98" y1="60" x2="112" y2="60" stroke="#9b8cf8" stroke-width="1.5"/>
  <!-- PFD -->
  <rect x="112" y="35" width="80" height="50" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="3"/>
  <text x="152" y="55" fill="#5bc4ef" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">PFD</text>
  <text x="152" y="68" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Phase/Freq</text>
  <text x="152" y="80" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Detector</text>
  <line x1="192" y1="60" x2="206" y2="60" stroke="#4a5470" stroke-width="1.5"/>
  <!-- CP+LF -->
  <rect x="206" y="35" width="90" height="50" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="3"/>
  <text x="251" y="52" fill="#5bc4ef" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Charge Pump</text>
  <text x="251" y="65" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">+ Loop Filter</text>
  <text x="251" y="78" fill="#c8b800" font-size="7" text-anchor="middle" font-family="monospace">sets BW+PN</text>
  <line x1="296" y1="60" x2="310" y2="60" stroke="#4a5470" stroke-width="1.5"/>
  <!-- VCO -->
  <rect x="310" y="27" width="100" height="66" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="3"/>
  <text x="360" y="50" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">VCO</text>
  <text x="360" y="65" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">2140 MHz out</text>
  <text x="360" y="78" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Vtune → freq</text>
  <text x="360" y="89" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">far-out noise</text>
  <line x1="410" y1="60" x2="430" y2="60" stroke="#4a5470" stroke-width="1.5"/>
  <!-- Splitter to output + divider -->
  <circle cx="435" cy="60" r="5" fill="#4a5470"/>
  <line x1="440" y1="60" x2="460" y2="60" stroke="#4a5470" stroke-width="1.5"/>
  <!-- Output to mixer -->
  <rect x="460" y="35" width="110" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="3"/>
  <text x="515" y="55" fill="#c8b800" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Mixer/Upconv</text>
  <text x="515" y="68" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">BB IQ × LO</text>
  <text x="515" y="80" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">→ RF signal out</text>
  <!-- Phase noise impact box -->
  <rect x="580" y="27" width="212" height="96" fill="#141720" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="686" y="45" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Phase Noise Impact</text>
  <text x="590" y="62" fill="#8892b0" font-size="8" font-family="monospace">Close-in (&lt;10kHz): loop BW limited</text>
  <text x="590" y="76" fill="#8892b0" font-size="8" font-family="monospace">Far-out (&gt;10kHz): VCO quality</text>
  <text x="590" y="90" fill="#c8b800" font-size="8" font-family="monospace">EVM floor: PN causes IQ smear</text>
  <text x="590" y="104" fill="#ff6b6b" font-size="8" font-family="monospace">ACLR: PN spreads carrier skirts</text>
  <!-- Feedback divider -->
  <line x1="435" y1="65" x2="435" y2="115" stroke="#00d4a0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="370" y="110" width="90" height="30" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1" rx="3"/>
  <text x="415" y="127" fill="#00d4a0" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">÷N Divider</text>
  <line x1="370" y1="125" x2="152" y2="125" stroke="#00d4a0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="152" y1="125" x2="152" y2="85" stroke="#00d4a0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="260" y="140" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">Feedback: VCO/N = 10MHz ref → PFD compares and locks</text>
</svg>