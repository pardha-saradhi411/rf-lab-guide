<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="200" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">TX Chain — Complete DL Signal Path (FHGW → RFFE → Antenna)</text>
  <!-- Blocks left to right -->
  <rect x="8"   y="30" width="72" height="50" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="3"/>
  <text x="44"  y="51" fill="#5bc4ef" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">BBU/DU</text>
  <text x="44"  y="64" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">IQ baseband</text>
  <text x="44"  y="75" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">eCPRI out</text>
  <line x1="80" y1="55" x2="94" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="94"  y="30" width="72" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="3"/>
  <text x="130" y="48" fill="#c8b800" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">FHGW</text>
  <text x="130" y="61" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">BFP decomp</text>
  <text x="130" y="72" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">IFFT + CP</text>
  <line x1="166" y1="55" x2="180" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="180" y="22" width="85" height="66" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="3"/>
  <text x="222" y="44" fill="#00d4a0" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">CFR</text>
  <text x="222" y="57" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Crest Factor</text>
  <text x="222" y="68" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Reduce PAPR</text>
  <text x="222" y="79" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">10-12dB→8dB</text>
  <line x1="265" y1="55" x2="279" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="279" y="22" width="85" height="66" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="3"/>
  <text x="321" y="44" fill="#00d4a0" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">DPD</text>
  <text x="321" y="57" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Pre-distort</text>
  <text x="321" y="68" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">linearise PA</text>
  <text x="321" y="79" fill="#f5a623" font-size="7" text-anchor="middle" font-family="monospace">60s converge</text>
  <line x1="364" y1="55" x2="378" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="378" y="30" width="72" height="50" fill="#0d1a1a" stroke="#5bc4ef" stroke-width="1.5" rx="3"/>
  <text x="414" y="48" fill="#5bc4ef" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">DAC</text>
  <text x="414" y="61" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Digital→RF</text>
  <text x="414" y="72" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">122.88 MSPS</text>
  <line x1="450" y1="55" x2="464" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="464" y="30" width="72" height="50" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="3"/>
  <text x="500" y="48" fill="#c8b800" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Upconv</text>
  <text x="500" y="61" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">BB→RF freq</text>
  <text x="500" y="72" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">LO + mixer</text>
  <line x1="536" y1="55" x2="550" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="550" y="22" width="85" height="66" fill="#2a0000" stroke="#ff6b6b" stroke-width="2.5" rx="3"/>
  <text x="592" y="44" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">PA ★</text>
  <text x="592" y="58" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">+43 dBm</text>
  <text x="592" y="70" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">GaN · Eff~35%</text>
  <text x="592" y="81" fill="#ff6b6b" font-size="7" text-anchor="middle" font-family="monospace">ACLR&lt;−45dBc</text>
  <line x1="635" y1="55" x2="649" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="649" y="30" width="72" height="50" fill="#1a0d0d" stroke="#f5a623" stroke-width="1.5" rx="3"/>
  <text x="685" y="48" fill="#f5a623" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Duplexer</text>
  <text x="685" y="61" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">TX→antenna</text>
  <text x="685" y="72" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">isolate RX</text>
  <line x1="721" y1="55" x2="735" y2="55" stroke="#4a5470" stroke-width="1.5"/>

  <rect x="735" y="30" width="57" height="50" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="3"/>
  <text x="763" y="51" fill="#9b8cf8" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Antenna</text>
  <text x="763" y="64" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">4×column</text>
  <text x="763" y="75" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">BF array</text>

  <!-- Observation path for DPD -->
  <line x1="592" y1="88" x2="592" y2="110" stroke="#00d4a0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="321" y1="110" x2="592" y2="110" stroke="#00d4a0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="321" y1="88" x2="321" y2="110" stroke="#00d4a0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="456" y="125" fill="#00d4a0" font-size="8" text-anchor="middle" font-family="monospace">DPD observation path — PA output fed back to adapt pre-distortion coefficients</text>

  <!-- BOB SMA coupler -->
  <rect x="640" y="110" width="120" height="30" fill="#141720" stroke="#4a5470" stroke-width="1" rx="3"/>
  <text x="700" y="122" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">BOB SMA coupler</text>
  <text x="700" y="134" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">−30 dB tap → EXA</text>
  <line x1="685" y1="80" x2="685" y2="110" stroke="#f5a623" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Key metrics -->
  <rect x="8" y="148" width="784" height="44" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="400" y="164" fill="#f5a623" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Key TX measurements at BOB SMA (coupler output, −30 dB from antenna):</text>
  <text x="60"  y="180" fill="#5bc4ef" font-size="8" text-anchor="middle" font-family="monospace">Power: B1=−16.7 dBm</text>
  <text x="190" y="180" fill="#5bc4ef" font-size="8" text-anchor="middle" font-family="monospace">B3=−15.7 dBm</text>
  <text x="310" y="180" fill="#5bc4ef" font-size="8" text-anchor="middle" font-family="monospace">B8=−18.0 dBm</text>
  <text x="430" y="180" fill="#5bc4ef" font-size="8" text-anchor="middle" font-family="monospace">B28=−27.3 dBm</text>
  <text x="560" y="180" fill="#5bc4ef" font-size="8" text-anchor="middle" font-family="monospace">B41=−23.0 dBm</text>
  <text x="700" y="180" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">ACLR&lt;−45 dBc</text>
</svg>