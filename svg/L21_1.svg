<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="130" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Timing Advance — Propagation Delay Compensation</text>
  <rect x="10" y="35" width="80" height="40" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="2" rx="4"/>
  <text x="50" y="59" fill="#5bc4ef" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">UE (far)</text>
  <line x1="90" y1="55" x2="700" y2="55" stroke="#f5a623" stroke-width="2"/>
  <polygon points="698,51 710,55 698,59" fill="#f5a623"/>
  <text x="400" y="47" fill="#f5a623" font-size="8" text-anchor="middle" font-family="monospace">UL signal · τ = d/c · 1km = 3.33 μs delay</text>
  <rect x="710" y="35" width="80" height="40" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="750" y="59" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">gNB/RU</text>
  <rect x="8" y="85" width="784" height="38" fill="#141720" stroke="#4a5470" stroke-width="1" rx="4"/>
  <text x="400" y="101" fill="#ff6b6b" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">Without TA: UE transmits at subframe boundary → arrives LATE → collides with next UE</text>
  <text x="400" y="116" fill="#00d4a0" font-size="8" font-weight="bold" text-anchor="middle" font-family="monospace">With TA: UE transmits TA/2 EARLY → arrives exactly on time → clean reception</text>
</svg>