<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="300" fill="#0d0f14" rx="8"/>
  <text x="400" y="22" fill="#f5a623" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">O-RAN Architecture — Your Daily Environment</text>

  <!-- SMO/OSS -->
  <rect x="300" y="35" width="200" height="30" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="400" y="54" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">SMO / OSS (Management)</text>

  <!-- O1 interface -->
  <line x1="400" y1="65" x2="400" y2="80" stroke="#9b8cf8" stroke-width="1.5"/>
  <text x="410" y="75" fill="#9b8cf8" font-size="8" font-family="monospace">O1 (NETCONF/YANG)</text>

  <!-- O-CU -->
  <rect x="300" y="80" width="200" height="30" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="400" y="99" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">O-CU (Central Unit)</text>

  <!-- F1 interface -->
  <line x1="400" y1="110" x2="400" y2="125" stroke="#5bc4ef" stroke-width="1.5"/>
  <text x="410" y="120" fill="#5bc4ef" font-size="8" font-family="monospace">F1 (PDCP/RRC)</text>

  <!-- O-DU -->
  <rect x="270" y="125" width="260" height="30" fill="#1a1a0d" stroke="#f5a623" stroke-width="2" rx="4"/>
  <text x="400" y="144" fill="#f5a623" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">O-DU (Distributed Unit) — FHGW</text>

  <!-- eCPRI fronthaul -->
  <line x1="400" y1="155" x2="400" y2="172" stroke="#f5a623" stroke-width="2"/>
  <text x="410" y="167" fill="#f5a623" font-size="9" font-weight="bold" font-family="monospace">eCPRI (Fronthaul 7.2x split)</text>
  <text x="330" y="167" fill="#4a5470" font-size="8" font-family="monospace">10GbE SFP+</text>

  <!-- O-RU -->
  <rect x="200" y="172" width="400" height="60" fill="#001a00" stroke="#00d4a0" stroke-width="2.5" rx="6"/>
  <text x="400" y="192" fill="#00d4a0" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">O-RU — Metro AAU 5-Band ← YOU ARE HERE</text>
  <text x="400" y="207" fill="#8892b0" font-size="9" text-anchor="middle" font-family="monospace">B1/B3/B8/B28/B41 · Units 26050508/509/510</text>
  <text x="400" y="220" fill="#4a5470" font-size="8" text-anchor="middle" font-family="monospace">midBRD (FHGW+DAC+LowPHY) + RFFE (PA+Filter+Duplexer) + 4T4R Antenna Array</text>

  <!-- 4 Planes -->
  <rect x="10"  y="245" width="185" height="45" fill="#0d1a2a" stroke="#5bc4ef" stroke-width="1.5" rx="4"/>
  <text x="102" y="262" fill="#5bc4ef" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">C-Plane</text>
  <text x="102" y="276" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Control: scheduling, beam</text>
  <text x="102" y="287" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">Section Type 0,1,3,6,7</text>

  <rect x="205" y="245" width="185" height="45" fill="#0d1a0d" stroke="#00d4a0" stroke-width="1.5" rx="4"/>
  <text x="297" y="262" fill="#00d4a0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">U-Plane</text>
  <text x="297" y="276" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">User data: IQ samples</text>
  <text x="297" y="287" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">DL/UL IQ, beamforming weights</text>

  <rect x="400" y="245" width="185" height="45" fill="#1a0d1a" stroke="#9b8cf8" stroke-width="1.5" rx="4"/>
  <text x="492" y="262" fill="#9b8cf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">M-Plane</text>
  <text x="492" y="276" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Management: NETCONF/YANG</text>
  <text x="492" y="287" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">RU config, fault, RSSI</text>

  <rect x="595" y="245" width="195" height="45" fill="#1a1a0d" stroke="#c8b800" stroke-width="1.5" rx="4"/>
  <text x="692" y="262" fill="#c8b800" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">S-Plane</text>
  <text x="692" y="276" fill="#8892b0" font-size="8" text-anchor="middle" font-family="monospace">Sync: PTP/SyncE timing</text>
  <text x="692" y="287" fill="#4a5470" font-size="7" text-anchor="middle" font-family="monospace">±1.5μs timing accuracy</text>
</svg>