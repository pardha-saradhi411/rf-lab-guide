<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:12px">
  <rect width="800" height="100" fill="#0d0f14" rx="8"/>
  <text x="400" y="18" fill="#c8c8d8" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">Interview Scenarios — Systematic Debug Method</text>
  <rect x="8" y="28" width="380" height="62" fill="#001a00" stroke="#00d4a0" stroke-width="2" rx="4"/>
  <text x="198" y="46" fill="#00d4a0" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">The method (applies to all scenarios):</text>
  <text x="18" y="62" fill="#8892b0" font-size="8" font-family="monospace">1. Confirm measurement valid (setup, attenuation, DPD converged)</text>
  <text x="18" y="76" fill="#8892b0" font-size="8" font-family="monospace">2. Isolate: which band, column, measurement? 3. 5-Why: change ONE variable at a time</text>
  <rect x="398" y="28" width="394" height="62" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="595" y="46" fill="#ff6b6b" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Common interview mistake:</text>
  <text x="408" y="62" fill="#8892b0" font-size="8" font-family="monospace">Jumping to "replace the PA" before checking measurement setup</text>
  <text x="408" y="76" fill="#8892b0" font-size="8" font-family="monospace">3 of 4 RF failures in lab are measurement / procedure errors</text>
</svg>